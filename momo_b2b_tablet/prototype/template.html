<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --main:#0A6E92; --main-deep:#07516C; --main-soft:#CDEBF6; --sub:#E8F8FF; --point:#B8830F; --point-text:#8E6509; --gold:#C8A96A;
  --ink:#16150F; --paper:#FFFDF7; --rule:#C9C0AB; --ash:#837E70; --pen:#1B2740;
  --stage:#D9E6EC; --bar:#FFFFFF; --bar-ink:#1F2A30; --bar-line:#C7D6DD;
  --line:9.5mm;
  --serif:"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --cover:"Gowun Batang","Noto Serif KR","Noto Serif CJK KR",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --stage:#1B262C; --bar:#121A1F; --bar-ink:#E3ECEF; --bar-line:#2C3A41; } }
:root[data-theme="dark"]{ --stage:#1B262C; --bar:#121A1F; --bar-ink:#E3ECEF; --bar-line:#2C3A41; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---------- toolbar ---------- */
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line);font-size:13px;flex-wrap:wrap}
.toolbar .brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.toolbar .brand img{height:24px;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.toolbar .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.grp{display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--bar-ink) 6%,transparent);border-radius:10px;padding:3px}
.tb{appearance:none;border:0;background:transparent;color:inherit;font:inherit;min-height:40px;min-width:40px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tb svg{width:18px;height:18px;flex:0 0 auto}
.tb[aria-pressed="true"]{background:var(--main);color:#fff}
.tb:focus-visible,.ox button:focus-visible,.ink-read:focus-visible,.sheet button:focus-visible{outline:2px solid var(--point);outline-offset:2px}
.tb:disabled{opacity:.35;cursor:default}
.tb.sw{padding:0 9px;gap:5px}.tb.sw i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px rgba(255,255,255,.8)}
.pageno{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:1400px){ .tb.sw .lbl{display:none} }
@media (max-width:1240px){ .toolbar .brand span{display:none} }
@media (max-width:980px){ .tb .lbl{display:none} }

/* ---------- stage ---------- */
.stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.scaler{position:relative;transform-origin:top left}
.pages{position:relative;width:210mm;height:148.5mm}
.page{position:absolute;inset:0;width:210mm;height:148.5mm;background:#fff;padding:6.5mm;visibility:hidden;box-shadow:0 10px 30px rgba(10,40,55,.18)}
.page.on{visibility:visible}

/* ---------- interior frame ---------- */
.frame{height:100%;display:grid;grid-template-columns:11mm 1fr;border-radius:1.6mm;overflow:hidden}
.spine{background:var(--main);color:var(--sub);display:flex;flex-direction:column;align-items:center;padding:3.5mm 0 3mm;gap:2.5mm}
.spine .lv{font:700 9px/1 var(--sans);color:var(--gold);letter-spacing:.02em}
.spine .v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.12em}
.spine .q{font:500 8.5px/1 var(--sans);opacity:.85}
.spine .t{font:700 12px/1 var(--serif);letter-spacing:.3em;color:#fff}
.spine .dotline{width:1px;flex:1;background:repeating-linear-gradient(to bottom,var(--gold) 0 1px,transparent 1px 4px);opacity:.6}
.spine .no{font:700 12px/1 var(--serif);color:#fff;font-variant-numeric:lining-nums}
.body{background:var(--sub);padding:4mm 5.5mm 4.5mm;display:flex;flex-direction:column;min-height:0;gap:3mm}
.head{flex:0 0 auto;display:flex;align-items:center;gap:3mm;height:10mm;border-bottom:1.2px solid var(--main);padding-bottom:2mm}
.head .step{font:700 10px/1 var(--sans);color:#fff;background:var(--main);padding:1.3mm 2.2mm;border-radius:1mm;letter-spacing:.04em}
.head h2{margin:0;font:700 16px/1.2 var(--serif);color:var(--ink)}
.head .guide{margin-left:auto;display:flex;align-items:flex-end;gap:2mm;height:100%}
.head .guide .who{display:flex;flex-direction:column;align-items:flex-end;gap:.8mm}
.head .guide .rt{font:700 10.5px/1 var(--sans);color:#fff;background:var(--main-deep);padding:1.2mm 2mm;border-radius:1mm}
.head .guide .nm{font:500 9px/1 var(--sans);color:var(--ash)}
.head .guide img{height:12.5mm;display:block;margin-bottom:-2.2mm}
.cols{flex:1 1 auto;min-height:0;display:grid;gap:5mm}
.col{display:flex;flex-direction:column;min-height:0;gap:2.6mm}

/* ---------- excerpt ---------- */
.excerpt{background:var(--paper);border-left:1.3mm solid var(--main);padding:3.6mm 4.4mm 3mm;font:500 14.5px/1.78 var(--serif);color:var(--ink);display:flex;flex-direction:column;min-height:0;word-break:keep-all;overflow-wrap:anywhere}
.excerpt p{margin:0 0 1.2mm}
.excerpt .cite{margin-top:auto;padding-top:1.5mm;align-self:flex-end;font:500 10px/1 var(--sans);color:var(--point-text)}
.excerpt.fill{flex:1 1 auto;justify-content:center;position:relative;padding-bottom:7mm}
.excerpt.fill .cite{position:absolute;right:4.4mm;bottom:3mm;margin:0;padding:0}

/* ---------- question ---------- */
.q{display:flex;flex-direction:column;min-height:0;gap:1.8mm}
.qhead{display:flex;gap:2.2mm;align-items:flex-start}
.stamp{flex:0 0 auto;min-width:7.4mm;height:7.4mm;padding:0 1.2mm;border-radius:4mm;background:var(--main);color:#fff;font:700 11px/7.4mm var(--serif);text-align:center;transform:rotate(-2deg);margin-top:.2mm}
.qtext{font:500 13.5px/1.55 var(--sans);color:var(--ink);word-break:keep-all;padding-top:.5mm}
.blank{display:flex;flex-direction:column;gap:1mm;min-height:0}
.blank .lab{align-self:flex-start;font:700 10px/1 var(--sans);color:var(--main-deep);background:var(--main-soft);padding:1.1mm 2mm;border-radius:1mm}

/* ---------- ink box ---------- */
.ink{position:relative;flex:0 0 auto;background:var(--paper);height:calc(var(--line) * 2);touch-action:none}
.ink canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ink .starter{position:absolute;left:2mm;top:calc(var(--line) - 5.4mm);font:500 12px/1 var(--sans);color:var(--ash);pointer-events:none}
.ink .ph{position:absolute;left:2mm;top:calc(var(--line) - 5.2mm);font:400 11px/1 var(--sans);color:color-mix(in srgb,var(--ash) 70%,transparent);pointer-events:none;transition:opacity .2s}
.ink.has .ph{opacity:0}
.ink-read{position:absolute;right:1.2mm;bottom:1.2mm;appearance:none;border:0;border-radius:2mm;background:var(--main);color:#fff;font:700 9.5px/1 var(--sans);padding:1.6mm 2.4mm;cursor:pointer;display:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ready .ink.has .ink-read{display:block}
.ink .badge{position:absolute;right:1.2mm;top:1.2mm;font:700 8.5px/1 var(--sans);padding:1mm 1.6mm;border-radius:1mm;display:none;pointer-events:none}
.ink.saved .badge{display:block;background:var(--main-soft);color:var(--main-deep)}
.ink.stale .badge{display:block;background:#F6E7C3;color:#7A5608}
.q,.blank{flex:0 0 auto}
.num-sq{flex:0 0 auto;width:7mm;height:7mm;border:.35mm solid var(--main-deep);background:#fff;color:var(--main-deep);font:700 12px/6.3mm var(--serif);text-align:center;margin-top:.2mm}

/* ---------- generated-image slot ---------- */
.slot{flex:1 1 auto;min-height:0;margin:0;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.4mm;border-radius:1mm;background:
  repeating-linear-gradient(135deg,color-mix(in srgb,var(--main) 7%,transparent) 0 1.2mm,transparent 1.2mm 3.6mm),var(--paper);
  outline:.3mm dashed color-mix(in srgb,var(--main) 45%,transparent);outline-offset:-.3mm;padding:3mm 4mm;overflow:hidden;text-align:center}
.review .slot{overflow-y:auto;justify-content:flex-start}
.slot[hidden]{display:none}
.slot .sl-t{font:700 11px/1.3 var(--sans);color:var(--main-deep)}
.slot .sl-r{font:500 9.5px/1 var(--sans);color:var(--point-text)}
.slot .sl-p{font:400 8.5px/1.45 var(--sans);color:#4a4840;max-width:92%;word-break:keep-all;display:none;text-align:left;background:rgba(255,255,255,.8);padding:1.6mm 2mm;border-radius:.8mm}
.review .slot .sl-p{display:block}

/* ---------- step 1 ---------- */
.sec{font:700 12.5px/1.3 var(--serif);color:var(--main-deep);display:flex;align-items:baseline;gap:2mm}
.sec small{font:400 10px/1.3 var(--sans);color:var(--ash)}
.vocab{flex:1 1 auto;display:flex;flex-direction:column;gap:2mm;min-height:0}
.vitem{flex:1 1 0;display:flex;flex-direction:column;gap:1mm;min-height:0}
.vtop{display:flex;align-items:baseline;gap:2mm;flex-wrap:wrap}
.vtop b{font:700 14px/1.2 var(--serif)}
.vtop .pg{font:500 9px/1 var(--sans);color:var(--point-text)}
.vtop .df{flex-basis:100%;font:400 11px/1.4 var(--sans);color:#3b3a33;word-break:keep-all}
.oxlist{flex:1 1 auto;display:flex;flex-direction:column;gap:1.6mm;min-height:0}
.oxitem{flex:1 1 0;max-height:19mm;display:grid;grid-template-columns:5mm 1fr auto;align-items:center;gap:2mm;background:var(--paper);border-radius:1mm;padding:1.4mm 2mm;border:.3mm solid color-mix(in srgb,var(--main) 18%,transparent)}
.oxitem .n{font:700 11px/1 var(--serif);color:var(--main)}
.oxitem .st{font:400 12px/1.45 var(--sans);word-break:keep-all}
.oxitem .st span{font:500 9px/1 var(--sans);color:var(--point-text);margin-left:1.2mm;white-space:nowrap}
.ox{display:flex;gap:1.6mm}
.ox button{appearance:none;width:9mm;height:9mm;border-radius:50%;border:.4mm solid var(--main);background:#fff;color:var(--main);font:700 14px/1 var(--sans);cursor:pointer;padding:0;display:grid;place-items:center}
.ox button[aria-pressed="true"]{background:var(--main);color:#fff}

/* ---------- step 1 pages ---------- */
.inst{margin:0;font:400 11.5px/1.5 var(--sans);color:#3b3a33;flex:0 0 auto}
.vgrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4mm 5mm}
.vcard{background:var(--paper);border-radius:1mm;border-top:1mm solid var(--main);padding:3mm 3.6mm 3.4mm;display:flex;flex-direction:column;gap:1.4mm;min-height:0}
.vcard .vtop b{font:700 19px/1.2 var(--serif)}
.vcard .vtop .pg{font-size:9.5px}
.vcard .df{margin:0 0 1mm;font:400 12px/1.5 var(--sans);color:#3b3a33;word-break:keep-all}
.vcard .vlab{font:700 9.5px/1 var(--sans);color:var(--main-deep)}
.oxp .oxitem .st{font-size:13px}

/* ---------- background knowledge (middle school) ---------- */
.tl{display:flex;flex-direction:column;gap:2.2mm;flex:0 0 auto}
.tl-row{display:flex;align-items:stretch}
.tl-n{flex:1 1 0;min-width:0;background:var(--paper);border:.3mm solid color-mix(in srgb,var(--main) 30%,transparent);border-radius:1mm;padding:1.3mm 1.8mm 1.5mm;display:flex;flex-direction:column;gap:.7mm}
.tl-n .y{font:700 9.5px/1 var(--sans);color:var(--point-text);min-height:9.5px}
.tl-n .e{font:500 11px/1.3 var(--sans);word-break:keep-all}
.tl-n .nt{font:400 8.5px/1.3 var(--sans);color:var(--ash);word-break:keep-all}
.tl-n.hl{background:var(--main);border-color:var(--main)}
.tl-n.hl .e{color:#fff;font-weight:700}.tl-n.hl .y,.tl-n.hl .nt{color:var(--main-soft)}
.tl-n.end{border:.45mm solid var(--main-deep);box-shadow:inset 0 0 0 .6mm var(--paper),inset 0 0 0 .9mm var(--main-deep)}
.tl-n.end .e{font-weight:700;color:var(--main-deep)}
.tl-arr{flex:0 0 3mm;align-self:center;height:3.2mm;background:var(--main);clip-path:polygon(25% 15%,80% 50%,25% 85%)}
.bg-bottom{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1.2fr;gap:5mm}
.bg-fig{margin:0;display:flex;flex-direction:column;gap:1.2mm;min-height:0}
.bg-fig img{width:100%;flex:1 1 auto;min-height:0;object-fit:cover;border-radius:1mm;display:block}
.bg-fig figcaption{font:500 9.5px/1 var(--sans);color:var(--point-text)}
.term{background:var(--paper);border-top:1mm solid var(--point);padding:2.8mm 4mm 3mm;min-height:0;overflow:hidden}
.term h4{margin:0 0 1.4mm;font:700 13px/1.3 var(--serif);color:var(--ink)}
.term p{margin:0;font:400 11.5px/1.65 var(--sans);word-break:keep-all;color:#2f2e28}
.draw-top{display:flex;align-items:center;gap:3mm;flex:0 0 auto}
.chip{font:700 9.5px/1 var(--sans);color:var(--main-deep);background:var(--main-soft);padding:1.2mm 2mm;border-radius:1mm;white-space:nowrap;margin-left:auto}
.ink.draw{flex:1 1 auto;height:auto!important;min-height:0}
.ink.plain .ink-read{display:none!important}
.excerpt.band{flex:0 0 auto;padding:3mm 4.4mm 2.6mm}
.excerpt.band .cite{margin-top:0}
/* tone: middle school */
.band-mid .excerpt{font-size:14px;line-height:1.75}
.band-mid .qtext{font-size:13px}
.band-mid .stamp{transform:none}
.cover .sub{font:400 16px/1.3 var(--cover);opacity:.92;margin:-.5mm 0 2.5mm}

/* ---------- answer widgets ---------- */
.wcol{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.wcol > .col{flex:1 1 auto}
.q.qw{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.q.qw > .col{flex:1 1 auto}
.nlist{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2mm}
.nlist.in{flex:0 0 auto}
.nrow{display:flex;gap:2.4mm;align-items:flex-start}
.nrow .nn{flex:0 0 auto;width:7.5mm;height:7.5mm;border-radius:50%;background:var(--main-soft);color:var(--main-deep);font:700 13px/7.5mm var(--serif);text-align:center;margin-top:.6mm}
.nrow .nb{flex:1 1 auto;display:flex;flex-direction:column;gap:.6mm;min-width:0}
.nside{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1.2mm}
.nside .nn{margin-top:.6mm}
.nrow .hint{font:700 10px/1 var(--sans);color:var(--point-text);background:#fff;border:.3mm solid color-mix(in srgb,var(--point) 50%,transparent);padding:.9mm 1.6mm;border-radius:1mm}
.cmp{flex:1 1 auto;min-height:0;display:grid;gap:4mm}
.cmp-fig{margin:0;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.cmp-fig img{max-width:100%;max-height:100%;object-fit:contain;border-radius:1mm}
.card{background:#fff;border-radius:1mm;border-top:1.1mm solid var(--main);padding:2.6mm 3.2mm 3mm;display:flex;flex-direction:column;gap:2.2mm;min-height:0}
.card h4{margin:0;font:700 14px/1.35 var(--serif);color:var(--main-deep);word-break:keep-all}
.pledge{flex:1 1 auto;min-height:0;background:#fff;border:.45mm solid var(--main);border-radius:1mm;box-shadow:inset 0 0 0 1.4mm #fff,inset 0 0 0 1.7mm var(--main-soft);padding:4.5mm 6mm;display:flex;flex-direction:column;gap:3mm}
.pl-title{display:flex;align-items:flex-end;justify-content:center;gap:2mm;font:700 18px/1 var(--serif);color:var(--ink)}
.pl-title .ink{width:36mm}
.pl-title span{padding-bottom:1.6mm}
.bubble{position:relative;align-self:flex-start;background:#fff;border:.35mm solid var(--main);border-radius:3.5mm;padding:2.2mm 3.8mm;font:500 14px/1.4 var(--sans);color:var(--main-deep);margin:0 0 3.4mm 2mm}
.bubble::after{content:"";position:absolute;left:5mm;bottom:-2.6mm;width:4mm;height:2.6mm;background:var(--main);clip-path:polygon(0 0,100% 0,15% 100%)}
.slot.img{background:transparent;outline:none;padding:0;justify-content:center}
.slot.img img{max-width:100%;max-height:100%;min-height:0;object-fit:contain;border-radius:1mm;flex:1 1 auto}
.slot.img .sl-p{position:absolute;left:1.5mm;bottom:1.5mm;right:1.5mm}
.vcard .sup{display:none;margin-left:1.4mm;font:700 8.5px/1 var(--sans);color:#7A5608;background:#F6E7C3;padding:.7mm 1.2mm;border-radius:.8mm;vertical-align:middle}
.review .vcard .sup{display:inline-block}
.topic.long{font-size:21px;line-height:1.35;word-break:keep-all}
/* tone: lower elementary */
.band-lower .excerpt{font-size:16.5px;line-height:1.8}
.band-lower .qtext{font-size:15px;line-height:1.5}
.band-lower .stamp{min-width:8.8mm;height:8.8mm;font-size:13px;line-height:8.8mm;transform:rotate(-3deg)}
.band-lower .inst{font-size:13.5px}
.band-lower .head .guide img{height:15.5mm;margin-bottom:-3mm}
.band-lower .oxitem .st{font-size:14.5px}
.band-lower .ox button{width:10.5mm;height:10.5mm;font-size:16px}
.band-lower .vcard .vtop b{font-size:22px}
.band-lower .vcard .df{font-size:12.5px;line-height:1.45}
.band-lower .vcard{padding:2.4mm 3mm 2.6mm;gap:1.1mm}
.band-lower .vgrid{gap:3mm 4mm}
.band-lower .ink .starter{font-size:14px;top:calc(var(--line) - 6.4mm)}
.band-lower .card h4{font-size:15.5px}
.band-lower .blank .lab{font-size:11.5px}
.band-lower .mrow{grid-template-columns:80mm 1fr}

/* ---------- tables ---------- */
.atable{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:.35mm solid var(--main);border-radius:1mm;overflow:hidden;background:var(--paper)}
.ar{display:grid;grid-template-columns:34mm 1fr;border-top:.3mm solid color-mix(in srgb,var(--main) 35%,transparent)}
.ar:first-child{border-top:0}
.ah{background:var(--main-soft);color:var(--main-deep);font:700 12px/1.4 var(--sans);padding:2.4mm 2.6mm;display:flex;flex-direction:column;justify-content:center;gap:.8mm;word-break:keep-all;border-right:.3mm solid color-mix(in srgb,var(--main) 35%,transparent)}
.ah small{font:500 9.5px/1.2 var(--sans);color:var(--point-text)}
.ac{min-width:0}
.ac .ink{background:transparent}
.ref{background:var(--paper);border-top:1mm solid var(--point);border-radius:1mm;padding:2.8mm 3.6mm 3mm;display:flex;flex-direction:column;gap:1.8mm;min-height:0;flex:1 1 auto}
.ref h4{margin:0;font:700 12.5px/1.3 var(--serif)}
.ref-body{display:flex;gap:3mm;min-height:0;flex:1 1 auto;align-items:flex-start}
.ref-body img{width:30mm;flex:0 0 auto;object-fit:contain;border-radius:1mm;background:#fff}
.rt{border-collapse:collapse;flex:1 1 auto;font:400 11px/1.35 var(--sans)}
.rt th,.rt td{border-bottom:.25mm solid color-mix(in srgb,var(--rule) 80%,transparent);padding:1.05mm 1.6mm;text-align:left;vertical-align:top}
.rt th{width:7mm;color:var(--main-deep);font:700 10.5px/1.35 var(--serif);text-align:center;background:var(--main-soft)}
.rt tr.gap td{text-align:center;color:var(--ash);padding:.4mm}
.ref .note{margin:0;font:400 10.5px/1.55 var(--sans);color:#3b3a33;word-break:keep-all}

/* ---------- step 3 memos ---------- */
.mtop{display:flex;align-items:baseline;gap:3mm;flex:0 0 auto}
.mtopic{font:700 20px/1.1 var(--cover);color:var(--main-deep)}
.mlead{font:400 11px/1.4 var(--sans);color:var(--ash)}
.mrows{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:3mm}
.mrow{display:grid;grid-template-columns:62mm 1fr;gap:5mm;align-items:start}
.mq{display:flex;gap:2.2mm;align-items:flex-start;padding-top:.6mm}

/* ---------- step 3 ---------- */
.topic{font:700 30px/1.15 var(--cover);color:var(--main-deep);margin:1mm 0 0}
.lead{font:400 11.5px/1.6 var(--sans);color:#3b3a33;word-break:keep-all;margin:0}
.dialog{background:var(--paper);border-left:1.3mm solid var(--point);padding:3.4mm 4.2mm;font:500 13.5px/1.75 var(--serif);flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:1.6mm}
.dialog p{margin:0}
.closing{font:400 10.5px/1.5 var(--sans);color:var(--ash);margin:0}

/* ---------- cover ---------- */
.cover{position:absolute;inset:6.5mm;border-radius:1.6mm;overflow:hidden;background:var(--main-deep);display:grid;grid-template-columns:1.25fr 1fr;color:#FBF6EA}
.cover::before{content:"";position:absolute;inset:0;background-image:
  radial-gradient(circle at 12% 18%,rgba(255,244,214,.9) 0 .5mm,transparent .6mm),
  radial-gradient(circle at 34% 9%,rgba(255,244,214,.6) 0 .35mm,transparent .45mm),
  radial-gradient(circle at 48% 26%,rgba(255,244,214,.75) 0 .45mm,transparent .55mm),
  radial-gradient(circle at 22% 78%,rgba(255,244,214,.55) 0 .35mm,transparent .45mm),
  radial-gradient(circle at 57% 84%,rgba(255,244,214,.7) 0 .4mm,transparent .5mm),
  radial-gradient(circle at 88% 12%,rgba(255,244,214,.8) 0 .45mm,transparent .55mm),
  radial-gradient(circle at 93% 90%,rgba(255,244,214,.55) 0 .35mm,transparent .45mm),
  radial-gradient(circle at 70% 52%,rgba(255,244,214,.35) 0 .3mm,transparent .4mm);opacity:.75;pointer-events:none}
.cover .l{position:relative;padding:11mm 6mm 10mm 12mm;display:flex;flex-direction:column}
.cover .logo{height:10mm;align-self:flex-start}
.cover .meta{margin-top:auto;display:flex;align-items:center;gap:3mm;font:700 11px/1 var(--sans);color:var(--gold);letter-spacing:.04em}
.cover .meta i{flex:1;height:1px;background:var(--gold);opacity:.7}
.cover h1{margin:4mm 0 2mm;font:700 50px/1.05 var(--cover);letter-spacing:.02em}
.cover .au{font:400 12.5px/1.4 var(--cover);opacity:.9}
.cover .dots{margin:6mm 0 4mm;width:26mm;height:1px;background:repeating-linear-gradient(to right,var(--gold) 0 1.2px,transparent 1.2px 4px)}
.cover blockquote{margin:0;font:400 15px/1.6 var(--cover);max-width:78mm}
.cover .r{position:relative;display:grid;place-items:center;padding:8mm 10mm 8mm 0}
.cover .r img{height:92mm;max-width:100%;object-fit:contain;border:.7mm solid var(--gold);outline:.5mm solid #FBF6EA;outline-offset:.9mm;box-shadow:0 6mm 12mm rgba(0,0,0,.28)}

/* ---------- sheets ---------- */
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,100vw);background:var(--bar);color:var(--bar-ink);border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));transition:transform .25s ease;z-index:20;max-height:80vh;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.sheet.open{transform:translate(-50%,0)}
.sheet h3{margin:0;font:700 15px/1.3 var(--sans)}
.sheet .sq{font:400 13px/1.5 var(--sans);opacity:.75;margin:0}
.sheet .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px}
.sheet .preview{background:#fff;border:1px solid var(--bar-line);border-radius:8px;min-height:90px;display:grid;place-items:center;overflow:hidden}
.sheet .preview img{max-width:100%;max-height:170px;display:block}
.sheet textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--bar-line);border-radius:8px;padding:10px 12px;font:400 15px/1.6 var(--sans);background:var(--bar);color:var(--bar-ink)}
.sheet .status{font:400 12.5px/1.4 var(--sans);opacity:.8;min-height:1.4em}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.sheet button{appearance:none;border:1px solid var(--bar-line);background:transparent;color:inherit;font:500 14px/1 var(--sans);padding:12px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.sheet button.primary{background:var(--main);border-color:var(--main);color:#fff}
.sheet button:disabled{opacity:.4}
.list{overflow:auto;display:flex;flex-direction:column;gap:10px}
.list .it{border:1px solid var(--bar-line);border-radius:10px;padding:10px 12px}
.list .it .k{font:700 12px/1.3 var(--sans);color:var(--main)}
.list .it .v{font:400 14px/1.55 var(--sans);white-space:pre-wrap;margin-top:4px}
.list .it .v.empty{opacity:.5}
.list .pt{margin-top:8px;padding-left:10px;border-left:2px solid var(--main-soft)}
.list .pl{font:700 12.5px/1.4 var(--sans)}.list .pl span{font-weight:400;opacity:.75}
.list .json summary{cursor:pointer;font:500 13px/1.4 var(--sans)}
.list .json pre{margin:8px 0 0;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto}
@media (max-width:560px){ .sheet .pair{grid-template-columns:1fr} }

.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-8px);background:var(--bar-ink);color:var(--bar);font:500 13px/1.4 var(--sans);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:.95;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){ .sheet,.toast{transition:none} }

/* ---------- print: A4 portrait, two A5-landscape pages per sheet ---------- */
@media print{
  @page{size:210mm 297mm;margin:0}
  :root{padding:0}
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  .toolbar,.sheet,.toast,.ink-read,.ink .badge,.ink .ph,.slot .sl-p{display:none!important}
  .stage{display:block;overflow:visible;touch-action:auto}
  .scaler{transform:none!important;width:auto!important;height:auto!important}
  .pages{width:auto;height:auto}
  .page{position:relative;inset:auto;visibility:visible!important;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .page:nth-child(2n){break-after:page;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="toolbar" role="toolbar" aria-label="학습지 도구">
  <div class="brand"><img src="__LOGO__" alt="모모의 책장"><span>__BRAND__</span></div>
  <div class="grp" role="group" aria-label="쓰기 도구">
    <button class="tb" id="tPen" aria-pressed="true" title="펜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20z"/><path d="M13.5 7.5l3 3"/></svg><span class="lbl">펜</span></button>
    <button class="tb" id="tEraser" aria-pressed="false" title="지우개"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h11"/><path d="M5.5 14.5l8-8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H8.5z"/><path d="M9.5 10.5l5 5"/></svg><span class="lbl">지우개</span></button>
    <button class="tb" id="tUndo" title="되돌리기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="lbl">되돌리기</span></button>
  </div>
  <div class="grp">
    <button class="tb" id="tFinger" aria-pressed="false" title="손가락으로도 쓰기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5"/><path d="M12 10V8.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a5 5 0 0 1-4.2-2.3L4.5 15a1.5 1.5 0 0 1 2.5-1.7L9 16"/></svg><span class="lbl">손가락 쓰기</span></button>
    <button class="tb" id="tAnswers" title="쓴 답안 모아보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8l3 3v13H5V4h3"/><path d="M8 11h8M8 15h6"/></svg><span class="lbl">답안 모아보기</span></button>
    <button class="tb" id="tReview" aria-pressed="true" title="그림 자리에 생성 지시문 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9.5" r="1.5"/></svg><span class="lbl">그림 자리 설명</span></button>
    <button class="tb" id="tPrint" title="A4 모아찍기로 인쇄"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><span class="lbl">인쇄</span></button>
  </div>
  <div class="grp" role="group" aria-label="분기 색">
    <button class="tb sw" data-q="winter" title="겨울 고전"><i style="background:#1C2A39"></i><span class="lbl">겨울</span></button>
    <button class="tb sw" data-q="spring" title="봄 탐구"><i style="background:#3F7A46"></i><span class="lbl">봄</span></button>
    <button class="tb sw" data-q="summer" title="여름 문학"><i style="background:#0A6E92"></i><span class="lbl">여름</span></button>
    <button class="tb sw" data-q="autumn" title="가을 인문"><i style="background:#836B5D"></i><span class="lbl">가을</span></button>
  </div>
  <div class="grp" role="group" aria-label="페이지 이동">
    <button class="tb" id="tPrev" title="이전 페이지" aria-label="이전 페이지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="pageno" id="pageNo" aria-live="polite">1 / 10</span>
    <button class="tb" id="tNext" title="다음 페이지" aria-label="다음 페이지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</header>

<main class="stage" id="stage"><div class="scaler" id="scaler"><div class="pages" id="pages"></div></div></main>

<section class="sheet" id="readSheet" aria-hidden="true" aria-labelledby="rsTitle">
  <h3 id="rsTitle">글자로 확인하기</h3>
  <p class="sq" id="rsQ"></p>
  <div class="pair">
    <div class="preview" id="rsPrev"></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <textarea id="rsText" aria-label="인식된 글자" placeholder="손글씨를 읽는 중이에요"></textarea>
      <div class="status" id="rsStatus"></div>
    </div>
  </div>
  <div class="row"><button id="rsClose">닫기</button><button class="primary" id="rsSave" disabled>이대로 저장</button></div>
</section>

<section class="sheet" id="ansSheet" aria-hidden="true" aria-labelledby="asTitle">
  <h3 id="asTitle">쓴 답안 모아보기</h3>
  <p class="sq">글자로 저장한 답안이 문항과 답란별로 모입니다. 빈칸이 나뉜 문항은 칸마다 따로 평가됩니다.</p>
  <div class="list" id="ansList"></div>
  <div class="row"><button id="asClose">닫기</button></div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
const IMG = __IMGS__;

__DATA__

/* ============ quarter palettes (design guide 1.2) + derived colours ============ */
const PALETTES = {
  winter:{ main:"#1C2A39", sub:"#F5F2E7", point:"#5A3E36" },
  spring:{ main:"#3F7A46", sub:"#FFF8E7", point:"#E2703A" },
  summer:{ main:"#0A6E92", sub:"#E8F8FF", point:"#B8830F" },
  autumn:{ main:"#836B5D", sub:"#E8DCC3", point:"#A8761F" } };
const PAL_NAME = { winter:"겨울 고전", spring:"봄 탐구", summer:"여름 문학", autumn:"가을 인문예술" };
let CURQ = QUARTER;
const hx = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const toHex = a => "#" + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mix = (a,b,t) => toHex(hx(a).map((v,i) => v + (hx(b)[i]-v)*t));
const lum = h => { const [r,g,b] = hx(h).map(v => { v/=255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*r + .7152*g + .0722*b; };
const contrast = (a,b) => { const x = lum(a), y = lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
function applyPalette(q){
  CURQ = q; const p = PALETTES[q], r = document.documentElement.style;
  let pt = p.point; for(let i = 0; i < 20 && contrast(pt, "#FFFDF7") < 4.5; i++) pt = mix(pt, "#000000", .08);   /* small-text variant */
  r.setProperty("--main", p.main); r.setProperty("--sub", p.sub); r.setProperty("--point", p.point);
  r.setProperty("--main-deep", mix(p.main, "#000000", q === "winter" ? .12 : .25));
  r.setProperty("--main-soft", mix(p.main, "#FFFFFF", .8));
  r.setProperty("--point-text", pt);
  document.querySelectorAll(".spine .q, .cover .qname").forEach(el => el.textContent = PAL_NAME[q]);
  document.querySelectorAll("[data-q]").forEach(b => b.setAttribute("aria-pressed", b.dataset.q === q));
}
document.documentElement.style.setProperty("--line", TONE.line + "mm");
document.body.classList.add("band-" + TONE.band);

/* ============ render ============ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const QTEXT = {};
/* question registry for evaluation: every question keeps its parts (one per answer box) */
const QREG = [];
const PARENT = {};
function partsOf(q){ return (q.blanks || []).map(x => typeof x === "string" ? { label:x } : x); }
function register(q, parts){ QREG.push({ id:q.id, no:q.no || q.id, text:q.t, parts }); parts.forEach(pt => { PARENT[pt.id] = q.t; }); }
/* answer lines: [min, max] per kind — answers grow only up to max; space beyond that becomes the image slot */
const LINES = Object.assign({ blankTall:[2,4], long:[2,4], short:[2,3], blank:[1,2], memo:[3,3], vocab:[2,3], one:[1,1], row:[1,2], cardInk:[2,4], inline:[1,1], cell:[2,4], rowTall:[1,3] }, TONE.lines || {});
function inkBox(id, kind, starter="", ph=""){
  const [mn,mx] = LINES[kind];
  return `<div class="ink" data-id="${esc(id)}" data-min="${mn}" data-max="${mx}" style="height:calc(var(--line) * ${mn})">${starter?`<span class="starter">${esc(starter)}</span>`:""}${ph?`<span class="ph">${esc(ph)}</span>`:""}<canvas aria-label="필기 답란"></canvas><span class="badge"></span><button class="ink-read" type="button">글자로 확인</button></div>`;
}
function drawBox(id){
  return `<div class="ink plain draw" data-id="${esc(id)}"><span class="ph">여기에 그려 보세요</span><canvas aria-label="그림 칸"></canvas><span class="badge"></span><button class="ink-read" type="button">글자로 확인</button></div>`;
}
const STYLE = (() => { const p = PALETTES[QUARTER]; return `${PAL_NAME[QUARTER]} 분기 하우스 스타일: ${p.main}·${p.sub}·${p.point} 3색 이내, 가는 잉크 선의 평면 일러스트, 배경은 종이색. 이미지 안에 글자 없음. 원작 삽화의 화풍과 인물 표현을 따라 하지 않는다. 흑백으로 복사해도 형태를 알아볼 수 있게.`; })();
function slotHtml(s, q){
  if(s.img) return `<figure class="slot img"><img src="${IMG[s.img]}" alt=""><figcaption class="sl-p">원본 교재 이미지를 그대로 씁니다${s.src ? ` (${esc(s.src)})` : ""}. 생성하지 않아요.</figcaption></figure>`;
  const prompt = `장면: ${s.scene}\n답 유출 금지: 질문 “${q.t}”의 답을 드러내지 않는다. ${s.avoid}\n${STYLE}`;
  return `<figure class="slot" data-prompt="${esc(prompt)}"><span class="sl-t">생성 이미지 자리</span><span class="sl-r"></span><span class="sl-p">${esc(prompt).replace(/\n/g,"<br>")}</span></figure>`;
}
function spine(pageNo, p){
  const title = (p && p.spineTitle) || BOOK.spineTitle || BOOK.title;
  return `<aside class="spine" aria-hidden="true"><span class="lv">${((p && p.level) || BOOK.level).replace(" ","")}</span><span class="v q">${PAL_NAME[CURQ]}</span><span class="v t">${esc(title)}</span><span class="dotline"></span><span class="no">${pageNo}</span></aside>`;
}
function head(p){
  return `<div class="head"><span class="step">${p.step}</span><h2>${esc(p.title)}</h2><div class="guide"><div class="who"><span class="rt">${esc(p.guide.rt)}</span>${p.guide.nm?`<span class="nm">${esc(p.guide.nm)}</span>`:""}</div>${p.guide.img?`<img src="${IMG[p.guide.img]}" alt="">`:""}</div></div>`;
}
/* answer widgets: every answer box becomes a "part" registered for evaluation */
function widget(q){
  const f = q.form || (q.blanks ? "blanks" : "single"); let parts = [], h = "";
  const P = (id, label, prompt) => { const pt = { id, label:label || "", prompt:prompt || "" }; parts.push(pt); return pt; };
  if(f === "blanks"){
    partsOf(q).forEach((b,k) => { const pt = P(`${q.id}#${k+1}`, b.label, b.prompt); h += `<div class="blank"><span class="lab">${esc(pt.label)}</span>${inkBox(pt.id,"blankTall")}</div>`; });
    h = `<div class="col" data-alloc>${h}</div>`;
  } else if(f === "single" || f === "speech"){
    P(q.id);
    const starter = q.starter && q.starter !== q.t ? q.starter : "";
    h = `<div class="col" data-alloc>${f === "speech" ? `<div class="bubble">${esc(q.starter)}</div>${inkBox(q.id, q.kind || "cardInk")}` : inkBox(q.id, q.kind || "long", starter)}</div>`;
  } else if(f === "list"){
    h = `<div class="nlist" data-alloc>${q.items.map((it,k) => { const pt = P(`${q.id}#${k+1}`, `${k+1}번${it.hint ? " (" + it.hint + ")" : ""}`, it.prompt); return `<div class="nrow"><div class="nside"><span class="nn">${k+1}</span>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ""}</div><div class="nb">${inkBox(pt.id, q.rowKind || "row")}</div></div>`; }).join("")}</div>`;
  } else if(f === "compare"){
    const cards = q.cards.map((c,ci) => {
      if(c.n){ const rows = Array.from({length:c.n}, (_,k) => { const pt = P(`${q.id}#${ci+1}-${k+1}`, `${c.title} ${k+1}`, c.prompt); return `<div class="nrow"><span class="nn">${k+1}</span><div class="nb">${inkBox(pt.id,"row")}</div></div>`; }).join("");
        return `<div class="card" data-alloc><h4>${esc(c.title)}</h4><div class="nlist in">${rows}</div></div>`; }
      const pt = P(`${q.id}#${ci+1}`, c.title, c.prompt);
      return `<div class="card" data-alloc><h4>${esc(c.title)}</h4>${inkBox(pt.id,"cardInk")}</div>`;
    }).join("");
    h = `<div class="cmp" style="grid-template-columns:${q.img ? "0.75fr " : ""}${q.cards.map(() => "1fr").join(" ")}">${q.img ? `<figure class="cmp-fig"><img src="${IMG[q.img]}" alt=""></figure>` : ""}${cards}</div>`;
  } else if(f === "table"){
    h = `<div class="atable" data-alloc>${q.rows.map((r,k) => { const pt = P(`${q.id}#${k+1}`, r.label, r.prompt); return `<div class="ar"><div class="ah">${esc(r.label)}${r.hint ? `<small>${esc(r.hint)}</small>` : ""}</div><div class="ac">${inkBox(pt.id,"cell").replace('class="ink"','class="ink noframe"')}</div></div>`; }).join("")}</div>`;
  } else if(f === "pledge"){
    const nm = P(`${q.id}#name`, "서약하는 사람");
    const rows = Array.from({length:q.n || 3}, (_,k) => { const pt = P(`${q.id}#${k+1}`, `서약 ${k+1}`); return `<div class="nrow"><span class="nn">${k+1}</span><div class="nb">${inkBox(pt.id,"row")}</div></div>`; }).join("");
    h = `<div class="pledge" data-alloc><div class="pl-title">${inkBox(nm.id,"inline")}<span>의 서약서</span></div><div class="nlist in">${rows}</div></div>`;
  }
  parts.forEach(pt => { QTEXT[pt.id] = pt.prompt || (pt.label ? `${q.t} (${pt.label})` : q.t); });
  register(q, parts);
  return h;
}
function qHead(q){ QTEXT[q.id] = q.t; return `<div class="qhead"><span class="stamp">${esc(q.id)}</span><div class="qtext">${esc(q.t)}</div></div>`; }
function question(q){
  if(q.form && q.form !== "blanks"){ return `<div class="q qw">${qHead(q)}${widget(q)}</div>`; }
  QTEXT[q.id] = q.t;
  const mark = q.kind === "memo" ? `<span class="num-sq">${esc(q.no)}</span>` : `<span class="stamp">${esc(q.id)}</span>`;
  const headHtml = `<div class="qhead">${mark}<div class="qtext">${esc(q.t)}</div></div>`;
  if(q.kind === "multi"){
    const parts = partsOf(q).map((b,i) => ({ id:`${q.id}#${i+1}`, label:b.label, prompt:b.prompt || "" }));
    parts.forEach(pt => { QTEXT[pt.id] = pt.prompt || `${q.t} (${pt.label})`; });
    register(q, parts);
    const body = parts.map(pt => `<div class="blank"><span class="lab">${esc(pt.label)}</span>${inkBox(pt.id,"blank")}</div>`).join("");
    return `<div class="q">${headHtml}${body}</div>`;
  }
  register(q, [{ id:q.id, label:"", prompt:"" }]);
  return `<div class="q">${headHtml}${inkBox(q.id, q.kind, q.starter||"")}</div>`;
}
function renderPage(p, i){
  if(p.type === "cover"){
    return `<div class="cover"><div class="l"><img class="logo" src="${IMG.logoIvory}" alt="모모의 책장"><div class="meta"><span>${BOOK.level}</span><span class="qname">${PAL_NAME[CURQ]}</span><span>${BOOK.week}</span><i></i></div><h1>${esc(BOOK.title)}</h1>${BOOK.subtitle?`<div class="sub">${esc(BOOK.subtitle)}</div>`:""}<div class="au">${esc(BOOK.byline || BOOK.author)}</div><div class="dots"></div><blockquote>${esc(BOOK.quote)}</blockquote></div><div class="r"><img src="${IMG.cover}" alt="『${esc(BOOK.title)}』 표지"></div></div>`;
  }
  let inner = "";
  if(p.type === "vocab"){
    const v = p.vocab.map(x => { QTEXT["V-"+x.w] = `‘${x.w}’(으)로 문장 만들기`; return `<div class="vcard" data-alloc><div class="vtop"><b>${esc(x.w)}</b>${x.p ? `<span class="pg">p.${x.p}</span>` : ""}${x.sup ? `<span class="sup">뜻 보충: 검수 필요</span>` : ""}</div><p class="df">${esc(x.d)}</p><span class="vlab">문장 만들기</span>${inkBox("V-"+x.w,"vocab")}</div>`; }).join("");
    inner = `<p class="inst">${esc(p.inst || "뜻을 읽고, 낱말을 넣어 나만의 문장을 만들어 봅시다.")}</p><div class="vgrid" style="grid-template-columns:repeat(${p.vocab.length > 4 ? 3 : 2},1fr)">${v}</div>`;

    const o = p.ox.map((x,k) => `<div class="oxitem"><span class="n">${k+1}</span><span class="st">${esc(x.s)}<span>p.${x.p}</span></span><span class="ox" data-ox="${k+1}"><button type="button" aria-pressed="false" aria-label="${k+1}번 O">O</button><button type="button" aria-pressed="false" aria-label="${k+1}번 X">X</button></span></div>`).join("");
    inner = `<div class="cols" style="grid-template-columns:1.45fr 1fr"><div class="col"><p class="inst">책의 내용과 맞으면 O, 틀리면 X를 누르세요.</p><div class="oxlist">${o}</div></div><div class="col" data-alloc>${slotHtml(p.slot, {t:"O·X 내용 확인 5문항"})}</div></div>`;

    inner = `<div class="cols" style="grid-template-columns:${p.ratio}"><div class="col">${ex}</div><div class="col" data-alloc>${p.slot ? slotHtml(p.slot, p.q) : ""}${question(p.q)}</div></div>`;

  } else if(p.type === "bgline"){
    const rows = p.rows.map(row => `<div class="tl-row">${row.map((n,j) => `${j ? '<span class="tl-arr" aria-hidden="true"></span>' : ""}<div class="tl-n${n.hl ? " hl" : ""}${n.end ? " end" : ""}"><span class="y">${esc(n.y || "")}</span><span class="e">${esc(n.e)}</span>${n.nt ? `<span class="nt">${esc(n.nt)}</span>` : ""}</div>`).join("")}</div>`).join("");
    inner = `<p class="inst">${esc(p.inst)}</p><div class="tl">${rows}</div><div class="bg-bottom"><figure class="bg-fig"><img src="${IMG[p.image.key]}" alt="${esc(p.image.caption)}"><figcaption>${esc(p.image.caption)}</figcaption></figure><div class="term"><h4>${esc(p.term.title)}</h4><p>${esc(p.term.text)}</p></div></div>`;
  } else if(p.type === "draw"){

    inner = `<div class="draw-top"><p class="inst">${esc(p.inst)}</p><span class="chip">${esc(p.chip || "그림 칸은 글자로 바꾸지 않아요")}</span></div>${drawBox(p.id)}`;

      inner = `${band}<div class="cols" style="grid-template-columns:${p.ratio || "1fr 1.15fr"}"><div class="col" data-alloc>${qHead(p.q)}${p.slot ? slotHtml(p.slot, p.q) : ""}</div><div class="col wcol">${w}</div></div>`;
    }

    inner = `${band}<div class="cols" style="grid-template-columns:${p.ratio || "1fr 1fr"}"><div class="col">${ref}</div><div class="col">${qHead(p.q)}<div class="wcol">${widget(p.q)}</div></div></div>`;
  } else if(p.type === "solo"){
    const w = widget(p.q);
    inner = `<div class="cols" style="grid-template-columns:${p.ratio || "1fr 1.25fr"}"><div class="col" data-alloc>${p.slot ? slotHtml(p.slot, p.q) : ""}</div><div class="col">${qHead(p.q)}<div class="wcol">${w}</div></div></div>`;
  } else if(p.type === "memos"){
    const rows = p.qs.map(q => { QTEXT[q.id] = q.t; register(q, [{ id:q.id, label:"", prompt:"" }]); return `<div class="mrow"><div class="mq"><span class="num-sq">${esc(q.no)}</span><div class="qtext">${esc(q.t)}</div></div>${inkBox(q.id,"memo")}</div>`; }).join("");
    inner = `<div class="mtop"><span class="mtopic">${esc(p.topic)}</span><span class="mlead">${esc(p.closing)}</span></div><div class="mrows">${rows}</div>`;
  }
  return `<div class="frame">${spine(i,p)}<div class="body">${head(p)}${inner}</div></div>`;
}
const pagesEl = document.getElementById("pages");
pagesEl.innerHTML = PAGES.map((p,i) => `<section class="page ${p.type}" data-i="${i}" aria-label="${i===0?"표지":i+"쪽"}">${renderPage(p,i)}</section>`).join("");
const pageEls = [...pagesEl.children];

/* ============ state ============ */
const KEY = "momo-b2b-proto:" + BOOK.id + ":v4";
let S = { ink:{}, text:{}, ox:{} };
try { const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); if(o && o.ink) S = Object.assign(S, o); } } catch(e) {}
let saveT = 0;
function persist(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }, 400); }

/* ============ ink engine ============ */
const MM = 96/25.4, LINE_PX = TONE.line*MM;
const RULE = getComputedStyle(document.documentElement).getPropertyValue("--rule").trim() || "#C9C0AB";
const tools = { mode:"pen", finger:false };
const history = [];
let lastPenAt = 0;
const boxes = new Map();

class InkBox {
  constructor(el){
    this.el = el; this.id = el.dataset.id; this.cv = el.querySelector("canvas"); this.ctx = this.cv.getContext("2d");
    this.strokes = S.ink[this.id] || []; this.cur = null; this.k = 1;
    this.cv.addEventListener("pointerdown", e => this.down(e));
    this.cv.addEventListener("pointermove", e => this.move(e));
    ["pointerup","pointercancel","lostpointercapture"].forEach(t => this.cv.addEventListener(t, e => this.up(e)));
    el.querySelector(".ink-read").addEventListener("click", e => { e.stopPropagation(); openRead(this); });
    el.querySelector(".ink-read").addEventListener("pointerdown", e => e.stopPropagation());
    this.syncState();
  }
  size(k){
    const w = this.cv.offsetWidth, h = this.cv.offsetHeight; if(!w || !h) return;
    this.k = k; this.cv.width = Math.round(w*k); this.cv.height = Math.round(h*k); this.draw();
  }
  pt(e){
    const r = this.cv.getBoundingClientRect(); const f = this.cv.offsetWidth / r.width;
    const p = e.pointerType === "pen" ? Math.max(.12, e.pressure || .5) : .5;
    return [ (e.clientX - r.left)*f, (e.clientY - r.top)*f, p ];
  }
  accepts(e){ return e.pointerType !== "touch" || tools.finger; }
  down(e){
    if(!this.accepts(e)) return;
    e.preventDefault(); e.stopPropagation();
    if(e.pointerType === "pen") lastPenAt = Date.now();
    this.cv.setPointerCapture(e.pointerId);
    if(tools.mode === "eraser"){ this.erasing = { removed:[] }; this.eraseAt(this.pt(e)); return; }
    this.cur = { w: 2.1, pts:[this.pt(e)] }; this.strokes.push(this.cur); this.drawStroke(this.cur);
  }
  move(e){
    if(!this.cur && !this.erasing) return;
    if(e.pointerType === "pen") lastPenAt = Date.now();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const ev of (evs.length ? evs : [e])){
      const p = this.pt(ev);
      if(this.erasing){ this.eraseAt(p); continue; }
      const a = this.cur.pts[this.cur.pts.length-1];
      if(Math.hypot(p[0]-a[0], p[1]-a[1]) < .6) continue;
      this.cur.pts.push(p); this.seg(this.cur, this.cur.pts.length-1);
    }
  }
  up(){
    if(this.erasing){
      if(this.erasing.removed.length){ history.push({ box:this, type:"erase", items:this.erasing.removed }); this.commit(); }
      this.erasing = null; return;
    }
    if(!this.cur) return;
    history.push({ box:this, type:"add", stroke:this.cur }); this.cur = null; this.commit();
  }
  eraseAt(p){
    const R = 7;
    for(let i = this.strokes.length-1; i >= 0; i--){
      const s = this.strokes[i];
      if(s.pts.some(q => Math.hypot(q[0]-p[0], q[1]-p[1]) < R)){ this.erasing.removed.push({ s, i }); this.strokes.splice(i,1); }
    }
    if(this.erasing.removed.length) this.draw();
  }
  commit(){
    S.ink[this.id] = this.strokes;
    const t = S.text[this.id]; if(t && t.saved) t.stale = true;
    this.syncState(); persist(); updateUndo();
  }
  syncState(){
    const has = this.strokes.length > 0, t = S.text[this.id];
    this.el.classList.toggle("has", has);
    this.el.classList.toggle("saved", !!(t && t.saved && !t.stale));
    this.el.classList.toggle("stale", !!(t && t.saved && t.stale && has));
    this.el.querySelector(".badge").textContent = (t && t.stale) ? "다시 확인" : "글자 저장됨";
  }
  draw(){
    const c = this.ctx, W = this.cv.width, H = this.cv.height;
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,W,H);
    /* every rule and the outline: same colour, same whole-pixel width */
    const lw = Math.max(1, Math.round(this.k * .95));
    c.fillStyle = RULE;
    const n = Math.max(1, Math.round(this.cv.offsetHeight / LINE_PX));
    if(!this.el.classList.contains("plain")) for(let i = 1; i < n; i++){ const y = Math.round(i * LINE_PX * this.k - lw/2); c.fillRect(0, y, W, lw); }
    if(!this.el.classList.contains("noframe")){ c.fillRect(0,0,W,lw); c.fillRect(0,H-lw,W,lw); c.fillRect(0,0,lw,H); c.fillRect(W-lw,0,lw,H); }
    for(const s of this.strokes) this.drawStroke(s);
  }
  style(c, s, p){ c.setTransform(this.k,0,0,this.k,0,0); c.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--pen").trim() || "#1B2740"; c.fillStyle = c.strokeStyle; c.lineCap = "round"; c.lineJoin = "round"; c.lineWidth = s.w*(.55 + .9*p); }
  drawStroke(s){
    if(s.pts.length === 1){ const [x,y,p] = s.pts[0]; const c = this.ctx; this.style(c,s,p); c.beginPath(); c.arc(x,y,c.lineWidth/2,0,Math.PI*2); c.fill(); return; }
    for(let i = 1; i < s.pts.length; i++) this.seg(s, i);
  }
  seg(s, i){
    const c = this.ctx, a = s.pts[i-1], b = s.pts[i], z = s.pts[i-2] || a;
    this.style(c, s, (a[2]+b[2])/2);
    const m1 = [(z[0]+a[0])/2, (z[1]+a[1])/2], m2 = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    c.beginPath(); c.moveTo(i === 1 ? a[0] : m1[0], i === 1 ? a[1] : m1[1]); c.quadraticCurveTo(a[0], a[1], m2[0], m2[1]);
    if(i === s.pts.length-1) c.lineTo(b[0], b[1]);
    c.stroke();
  }
  toBlob(){
    const w = this.cv.offsetWidth, h = this.cv.offsetHeight, k = 2.4;
    const cv = document.createElement("canvas"); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
    const c = cv.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0,0,cv.width,cv.height);
    c.setTransform(k,0,0,k,0,0); c.strokeStyle = "#111"; c.fillStyle = "#111"; c.lineCap = "round"; c.lineJoin = "round";
    for(const s of this.strokes){
      c.beginPath(); c.lineWidth = s.w*1.25;
      s.pts.forEach((p,j) => j ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]));
      if(s.pts.length === 1){ c.arc(s.pts[0][0], s.pts[0][1], 1.2, 0, Math.PI*2); c.fill(); } else c.stroke();
    }
    return new Promise(res => cv.toBlob(b => res({ blob:b, url:cv.toDataURL("image/png") }), "image/png"));
  }
}
document.querySelectorAll(".ink").forEach(el => boxes.set(el.dataset.id, new InkBox(el)));

function updateUndo(){ document.getElementById("tUndo").disabled = history.length === 0; }
document.getElementById("tUndo").addEventListener("click", () => {
  const h = history.pop(); if(!h) return;
  const b = h.box;
  if(h.type === "add"){ const i = b.strokes.lastIndexOf(h.stroke); if(i >= 0) b.strokes.splice(i,1); }
  else { h.items.slice().reverse().forEach(({s,i}) => b.strokes.splice(Math.min(i, b.strokes.length), 0, s)); }
  b.draw(); b.commit();
  const pi = +b.el.closest(".page").dataset.i; if(pi !== cur) go(pi);
});
function setMode(m){ tools.mode = m; document.getElementById("tPen").setAttribute("aria-pressed", m === "pen"); document.getElementById("tEraser").setAttribute("aria-pressed", m === "eraser"); }
document.getElementById("tPen").addEventListener("click", () => setMode("pen"));
document.getElementById("tEraser").addEventListener("click", () => setMode("eraser"));
document.getElementById("tFinger").addEventListener("click", e => { tools.finger = !tools.finger; e.currentTarget.setAttribute("aria-pressed", tools.finger); toast(tools.finger ? "손가락으로도 쓸 수 있어요. 페이지는 위쪽 화살표로 넘기세요." : "펜으로만 써요. 손가락으로 밀면 페이지가 넘어가요."); });

/* ============ OX ============ */
document.querySelectorAll(".ox").forEach(g => {
  const k = g.dataset.ox, [bo, bx] = g.querySelectorAll("button");
  const paint = () => { bo.setAttribute("aria-pressed", S.ox[k] === "O"); bx.setAttribute("aria-pressed", S.ox[k] === "X"); };
  bo.addEventListener("click", () => { S.ox[k] = S.ox[k] === "O" ? undefined : "O"; paint(); persist(); });
  bx.addEventListener("click", () => { S.ox[k] = S.ox[k] === "X" ? undefined : "X"; paint(); persist(); });
  paint();
});

/* ============ layout & paging ============ */
let cur = 0, scale = 1;
const stage = document.getElementById("stage"), scaler = document.getElementById("scaler");
/* answers first (up to their max lines), then any remaining space opens the image slot */
const SLOT_MIN = 30*MM, GAP = 2.6*MM;
const RATIOS = [["1:1",1],["4:3",4/3],["3:4",3/4],["3:2",3/2],["2:1",2]];
function allocate(){
  document.querySelectorAll("[data-alloc]").forEach(col => {
    const inks = [...col.querySelectorAll(".ink[data-max]")].filter(el => el.parentElement.closest("[data-alloc]") === col), slot = [...col.children].find(c => c.classList.contains("slot"));
    if(slot) slot.hidden = true;
    const shrink = col.classList.contains("atable"); if(shrink) col.style.flex = "";
    inks.forEach(el => { el._n = +el.dataset.min; el.style.height = (el._n*LINE_PX) + "px"; });
    const used = () => { const kids = [...col.children].filter(k => !k.hidden); const last = kids[kids.length-1]; if(!last) return 0; return last.offsetTop + last.offsetHeight - col.offsetTop; };
    let free = col.clientHeight - used();
    const even = col.classList.contains("nlist");   /* numbered rows grow together so they stay the same height */
    while(even){
      const c = inks.filter(el => el._n < +el.dataset.max);
      if(!c.length || free < LINE_PX * c.length) break;
      c.forEach(el => { el._n++; el.style.height = (el._n*LINE_PX) + "px"; }); free -= LINE_PX * c.length;
    }
    for(;!even;){
      const c = inks.filter(el => el._n < +el.dataset.max).sort((a,b) => a._n/+a.dataset.max - b._n/+b.dataset.max)[0];
      if(!c || free < LINE_PX) break;
      c._n++; c.style.height = (c._n*LINE_PX) + "px"; free -= LINE_PX;
    }
    if(shrink) col.style.flex = "0 0 auto";   /* table ends at its last ruled line */
    if(slot && free - GAP >= SLOT_MIN){
      slot.hidden = false;
      const r = slot.offsetWidth / slot.offsetHeight;
      const best = RATIOS.reduce((a,b) => Math.abs(Math.log(b[1]/r)) < Math.abs(Math.log(a[1]/r)) ? b : a);
      if(slot.querySelector(".sl-r")) slot.querySelector(".sl-r").textContent = `${Math.round(slot.offsetWidth/MM)} × ${Math.round(slot.offsetHeight/MM)}mm, ${best[0]} 비율로 생성`;
    }
  });
}
function fit(){
  allocate();
  const pw = pagesEl.offsetWidth, ph = pagesEl.offsetHeight, pad = 18;
  scale = Math.max(.2, Math.min((stage.clientWidth - pad*2)/pw, (stage.clientHeight - pad*2)/ph));
  scaler.style.transform = `scale(${scale})`; scaler.style.width = pw*scale + "px"; scaler.style.height = ph*scale + "px";
  const k = scale * (window.devicePixelRatio || 1);
  boxes.forEach(b => b.size(k));
}
function go(i){
  cur = Math.max(0, Math.min(PAGES.length-1, i));
  pageEls.forEach((el,j) => { el.classList.toggle("on", j === cur); el.setAttribute("aria-hidden", j !== cur); });
  document.getElementById("pageNo").textContent = `${cur+1} / ${PAGES.length}`;
  document.getElementById("tPrev").disabled = cur === 0; document.getElementById("tNext").disabled = cur === PAGES.length-1;
}
document.getElementById("tPrev").addEventListener("click", () => go(cur-1));
document.getElementById("tNext").addEventListener("click", () => go(cur+1));
addEventListener("keydown", e => { if(e.target.tagName === "TEXTAREA") return; if(e.key === "ArrowRight") go(cur+1); if(e.key === "ArrowLeft") go(cur-1); });
addEventListener("resize", fit);
if(window.visualViewport) visualViewport.addEventListener("resize", fit);

/* finger swipe = page turn (ignored right after pen use, so a resting palm never flips the page) */
let sw = null;
stage.addEventListener("pointerdown", e => { if(e.pointerType !== "touch") return; if(tools.finger && e.target.tagName === "CANVAS") return; sw = { x:e.clientX, y:e.clientY, t:Date.now(), id:e.pointerId }; }, true);
stage.addEventListener("pointerup", e => {
  if(!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y, dt = Date.now() - sw.t; sw = null;
  if(Date.now() - lastPenAt < 900) return;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.6 && dt < 700) go(cur + (dx < 0 ? 1 : -1));
}, true);

/* print: render every canvas at print resolution first */
function printPrep(){ boxes.forEach(b => b.size(3.2)); }
addEventListener("beforeprint", printPrep);
addEventListener("afterprint", fit);
document.getElementById("tPrint").addEventListener("click", () => { printPrep(); try { window.print(); } catch(e) { toast("이 화면에서는 인쇄를 열 수 없어요. 브라우저 메뉴의 인쇄를 이용하세요."); } });

/* ============ toast ============ */
let tt = 0;
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3200); }

/* ============ handwriting → text (Claude via artifact runtime) ============ */
let sample = null, readCtl = null, readBox = null;
const rs = { sheet:document.getElementById("readSheet"), q:document.getElementById("rsQ"), prev:document.getElementById("rsPrev"), text:document.getElementById("rsText"), status:document.getElementById("rsStatus"), save:document.getElementById("rsSave") };
function openSheet(el){ el.classList.add("open"); el.setAttribute("aria-hidden","false"); }
function closeSheet(el){ el.classList.remove("open"); el.setAttribute("aria-hidden","true"); }
function hideReading(){ document.body.classList.remove("ready"); sample = null; }
const COPY = {
  rate_limited:"요청이 많아 잠시 쉬어야 해요. 조금 뒤에 다시 눌러 주세요.",
  session_expired:"다시 로그인한 뒤 눌러 주세요.",
  image_rejected:"필기 이미지를 보낼 수 없었어요. 조금 더 써 본 뒤 다시 눌러 주세요.",
  refused:"이 필기는 글자로 바꿀 수 없었어요. 직접 입력해 주세요.",
  empty_completion:"글자를 찾지 못했어요. 직접 입력해 주세요.",
  invalid_json:"결과를 읽지 못했어요. 다시 눌러 주세요.",
  upstream_error:"연결이 끊겼어요. 다시 눌러 주세요."
};
async function openRead(box){
  if(!sample || !box.strokes.length) return;
  readBox = box; readCtl && readCtl.abort(); readCtl = new AbortController();
  rs.q.textContent = QTEXT[box.id] || ""; rs.text.value = ""; rs.text.placeholder = "손글씨를 읽는 중이에요"; rs.save.disabled = true; rs.status.textContent = "읽는 중…";
  const { blob, url } = await box.toBlob();
  rs.prev.innerHTML = `<img alt="보낸 필기" src="${url}">`;
  openSheet(rs.sheet);
  const prompt = [
    `이미지는 ${TONE.grade} 학생이 태블릿에 펜으로 쓴 한국어 손글씨 답안입니다.`,
    ...(PARENT[box.id] && PARENT[box.id] !== QTEXT[box.id]
      ? [`전체 질문: ${PARENT[box.id]}`, `이 답란이 답하는 부분: ${QTEXT[box.id]}`]
      : [`학생이 답한 질문: ${QTEXT[box.id] || "(없음)"}`]),
    "할 일: 이미지에 적힌 글자를 보이는 그대로 옮겨 적으세요.",
    "- 맞춤법과 띄어쓰기를 고치지 마세요. 내용을 보태거나 질문에 맞게 바꾸지 마세요.",
    "- 줄바꿈은 쓴 그대로 유지하세요.",
    "- 도저히 알아볼 수 없는 글자는 [?] 로 적으세요. 지운 흔적과 낙서는 무시하세요.",
    'JSON 하나로만 답하세요. 예: {"text": "옮겨 적은 내용", "unclear": 0}'
  ].join("\n");
  const ctl = readCtl;
  try{
    const r = await sample.json(prompt, { images: blob, signal: ctl.signal });
    if(ctl.signal.aborted) return;
    const txt = (r && typeof r.text === "string") ? r.text : "";
    rs.text.value = txt; rs.save.disabled = false;
    const n = Number(r && r.unclear) || 0;
    rs.status.textContent = n ? `알아보기 어려운 글자 ${n}개를 [?]로 표시했어요. 고친 뒤 저장하세요.` : "읽은 내용이 맞는지 확인하고, 틀린 곳은 고쳐서 저장하세요.";
    rs.text.focus({ preventScroll:true });
  }catch(e){
    if(e && e.code === "cancelled") return;
    if(e && ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"].includes(e.code)){
      hideReading(); rs.status.textContent = "이 화면에서는 글자 확인을 쓸 수 없어요. 아래에 직접 입력해 저장할 수 있어요."; rs.save.disabled = false; return;
    }
    rs.status.textContent = COPY[e && e.code] || COPY.upstream_error; rs.save.disabled = false;
  }
}
rs.text.addEventListener("input", () => { rs.save.disabled = false; });
rs.save.addEventListener("click", () => {
  if(!readBox) return;
  S.text[readBox.id] = { text: rs.text.value.trim(), saved:true, stale:false, at: Date.now() };
  readBox.syncState(); persist(); closeSheet(rs.sheet); toast("글자로 저장했어요.");
});
document.getElementById("rsClose").addEventListener("click", () => { readCtl && readCtl.abort(); closeSheet(rs.sheet); });

/* answers overview */
function answerOf(id){ const t = S.text[id], b = boxes.get(id); return { answer: t && t.saved ? t.text : "", confirmed: !!(t && t.saved && !t.stale), has_ink: !!(b && b.strokes.length) }; }
function evalPayload(){
  const ox = []; PAGES.forEach(p => { if(p.type === "oxp") p.ox.forEach((x,k) => ox.push({ no:k+1, statement:x.s, choice:S.ox[k+1] || null })); });
  return { doc_id:BOOK.id, book:BOOK.title, level:BOOK.level, ox,
    questions: QREG.map(q => ({ question_id:q.id, number:q.no, question:q.text,
      parts: q.parts.map(pt => Object.assign({ part_id:pt.id }, pt.label ? { label:pt.label } : {}, pt.prompt ? { prompt:pt.prompt } : {}, answerOf(pt.id))) })) };
}
function stateLine(a){ return a.answer ? esc(a.answer) + (a.confirmed ? "" : "<br><small>(필기를 고친 뒤 다시 확인하지 않았어요)</small>") : (a.has_ink ? "필기만 있어요. 답란의 ‘글자로 확인’을 눌러 주세요." : "아직 쓰지 않았어요."); }
document.getElementById("tAnswers").addEventListener("click", () => {
  const P = evalPayload(); let h = "";
  if(P.ox.length) h += `<div class="it"><div class="k">내용 확인 O·X</div><div class="v">${P.ox.map(o => `${o.no}. ${o.choice || "–"}`).join("   ")}</div></div>`;
  P.questions.forEach(q => {
    if(q.parts.length === 1 && !q.parts[0].label){ const a = q.parts[0]; h += `<div class="it"><div class="k">${esc(q.number)}. ${esc(q.question)}</div><div class="v ${a.answer ? "" : "empty"}">${stateLine(a)}</div></div>`; return; }
    h += `<div class="it"><div class="k">${esc(q.number)}. ${esc(q.question)}</div>${q.parts.map((a,i) => `<div class="pt"><div class="pl">(${i+1}) ${esc(a.label)}${a.prompt ? ` <span>— ${esc(a.prompt)}</span>` : ""}</div><div class="v ${a.answer ? "" : "empty"}">${stateLine(a)}</div></div>`).join("")}</div>`;
  });
  h += `<details class="it json"><summary>평가용 데이터(JSON) 보기</summary><pre>${esc(JSON.stringify(P, null, 2))}</pre></details>`;
  document.getElementById("ansList").innerHTML = h;
  openSheet(document.getElementById("ansSheet"));
});
document.getElementById("asClose").addEventListener("click", () => closeSheet(document.getElementById("ansSheet")));

document.body.classList.add("review");
document.getElementById("tReview").addEventListener("click", e => { const on = !document.body.classList.contains("review"); document.body.classList.toggle("review", on); e.currentTarget.setAttribute("aria-pressed", on); });
document.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => applyPalette(b.dataset.q)));
/* boot */
applyPalette(QUARTER);
go(0);
requestAnimationFrame(() => { fit(); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
setTimeout(() => toast("펜으로 답란에 써 보세요. 손가락으로 밀면 페이지가 넘어가요."), 600);
(async () => {
  if(!(window.claude && typeof window.claude.use === "function")) return;
  try{
    const s = await window.claude.use("sample");
    if(!s) return;
    const lim = await s.limits().catch(() => null);
    if(!lim || !lim.images) return;
    sample = s; document.body.classList.add("ready");
  }catch(e){}
})();
</script>
</body>
</html>
