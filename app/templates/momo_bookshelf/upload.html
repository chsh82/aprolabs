{% extends "base.html" %}
{% block title %}모모의 책장 업로드 - Aprolabs{% endblock %}

{% block content %}
<div class="mb-6">
  <a href="/momo-bookshelf" class="text-sm text-gray-400 hover:text-gray-600">← 모모의 책장 목록</a>
  <h2 class="text-2xl font-bold text-gray-800 mt-1">⬆️ 커리큘럼 업로드</h2>
  <p class="text-sm text-gray-400 mt-1">
    "연간 전체 리스트" 시트가 있고 분기/학년/주차/기간/도서명/저자(역자)/출판사 7개 열을 가진
    .xlsx 파일을 업로드하세요. 같은 연도+분기+학년+주차 조합이 이미 있으면 덮어씁니다.
  </p>
</div>

<div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 mb-5 max-w-lg">
  <div class="mb-4">
    <label class="block text-xs font-semibold text-gray-500 mb-1">연도 <span class="text-red-400">*</span></label>
    <input id="inp-year" type="number" value="{{ default_year }}" placeholder="예: 2026"
           class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-32 focus:outline-none focus:ring-2 focus:ring-blue-400">
  </div>
  <div class="mb-4">
    <label class="block text-xs font-semibold text-gray-500 mb-1">엑셀 파일 <span class="text-red-400">*</span></label>
    <input id="inp-file" type="file" accept=".xlsx,.xls"
           class="border border-gray-200 rounded-lg px-3 py-2 text-sm w-full">
  </div>
  <button id="btn-upload" onclick="doUpload()"
          class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition">
    업로드
  </button>
</div>

<div id="status-area"></div>

<script>
async function doUpload() {
  const year = document.getElementById('inp-year').value;
  const fileInput = document.getElementById('inp-file');
  const statusArea = document.getElementById('status-area');
  const btn = document.getElementById('btn-upload');

  if (!year) {
    statusArea.innerHTML = `<p class="text-sm text-red-500">연도를 입력하세요.</p>`;
    return;
  }
  if (!fileInput.files.length) {
    statusArea.innerHTML = `<p class="text-sm text-red-500">파일을 선택하세요.</p>`;
    return;
  }

  const form = new FormData();
  form.append('year', year);
  form.append('file', fileInput.files[0]);

  btn.disabled = true;
  btn.textContent = '업로드 중...';
  statusArea.innerHTML = `<p class="text-sm text-gray-400">업로드 및 파싱 중입니다...</p>`;

  try {
    const res = await fetch('/momo-bookshelf/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) {
      statusArea.innerHTML = `<p class="text-sm text-red-500">${escapeHtml(data.detail || '업로드 중 오류가 발생했습니다.')}</p>`;
      return;
    }
    statusArea.innerHTML = `
      <div class="bg-green-50 border border-green-100 rounded-xl p-4 text-sm text-green-700">
        총 ${data.total}건 처리 완료 — 신규 ${data.added}건, 갱신 ${data.updated}건.
        <a href="/momo-bookshelf?year=${year}" class="underline ml-2">목록 보기 →</a>
      </div>`;
  } catch (e) {
    statusArea.innerHTML = `<p class="text-sm text-red-500">네트워크 오류가 발생했습니다.</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '업로드';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>
{% endblock %}
