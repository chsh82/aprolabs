{% extends "base.html" %}
{% block title %}다유형 어휘 퀴즈{% endblock %}
{% block content_wrapper %}
<div class="max-w-xl mx-auto px-6 py-10">
  <div class="text-center mb-6">
    <div class="text-5xl mb-4">🧩</div>
    <h1 class="text-2xl font-bold mb-2">다유형 어휘 퀴즈 (파일럿 R&D)</h1>
    <p class="text-sm text-gray-500">관리자 전용, 학생 비공개 · 서버 채점</p>
  </div>

  <div id="setup-screen">
    <label class="flex items-center gap-2 border rounded-lg px-3 py-2 text-sm cursor-pointer mb-4 bg-amber-50 border-amber-300"
           {% if not pilot_available %}title="현재 파일럿 후보가 0건입니다"{% endif %}>
      <input type="checkbox" id="pilot-mode-checkbox" {% if not pilot_available %}disabled{% endif %}>
      <span>L4·L5 파일럿 문항만 출제 (phase18, 관리자 검토 전용{% if not pilot_available %} — 후보 없음{% endif %})</span>
    </label>

    <div id="level-scope-fields">
    <p class="text-sm font-semibold text-gray-700 mb-2">출제 범위 (관리자 전용)</p>
    <select id="level-select" class="border rounded-lg px-3 py-2 w-full mb-1 text-sm">
      <option value="">전체</option>
      {% for lv, label in level_grade_labels.items() %}
      <option value="{{ lv }}" {% if lv in level_disabled %}disabled{% endif %}>
        L{{ lv }} {{ label }}{% if lv in level_disabled %} — 데이터 준비 중{% endif %}
      </option>
      {% endfor %}
    </select>
    <p id="level-warning-badge" class="text-xs text-amber-600 mb-3 hidden"></p>
    </div>

    <div id="confidence-field" class="hidden">
      <p class="text-sm font-semibold text-gray-700 mb-2">후보 신뢰도</p>
      <div class="flex gap-2 mb-3">
        <label class="flex-1 border rounded-lg px-3 py-2 text-xs cursor-pointer flex items-center gap-1.5">
          <input type="radio" name="confidence-mode" value="all_candidates" checked>
          <span>전체 후보(권장)</span>
        </label>
        <label class="flex-1 border rounded-lg px-3 py-2 text-xs cursor-pointer flex items-center gap-1.5">
          <input type="radio" name="confidence-mode" value="auto_only">
          <span>고신뢰도만</span>
        </label>
      </div>
    </div>

    <p class="text-sm font-semibold text-gray-700 mb-2">유형 선택 (선택 안 하면 전체 혼합)</p>
    <div class="grid grid-cols-1 gap-2 mb-1" id="type-checkboxes">
      {% for t in item_types %}
      <label class="flex items-center justify-between gap-2 border rounded-lg px-3 py-2 text-sm cursor-pointer" data-type-row="{{ t }}">
        <span class="flex items-center gap-2"><input type="checkbox" value="{{ t }}" class="type-checkbox"><span>{{ t }}</span></span>
        <span class="text-xs text-gray-400 type-count" data-type-count="{{ t }}"></span>
      </label>
      {% endfor %}
    </div>
    <p id="crossword-notice" class="text-sm text-gray-500 mb-4 hidden"></p>

    <div id="question-count-field">
      <label class="block text-sm font-semibold text-gray-700 mb-1">문항 수</label>
      <input type="number" id="question-count" value="{{ default_question_count }}" min="1" max="50"
             class="border rounded-lg px-3 py-2 w-full mb-1 text-sm">
      <p id="availability-info" class="text-xs text-gray-500 mb-4"></p>
    </div>
    <button id="start-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3.5 rounded-xl text-base">
      퀴즈 시작
    </button>
    <p id="setup-error" class="text-sm text-red-600 mt-3 hidden"></p>
  </div>

  <div id="question-screen" class="hidden">
    <div class="flex justify-between items-center text-xs text-gray-500 mb-2">
      <span id="progress-label"></span>
      <span id="type-label" class="font-semibold text-gray-700"></span>
    </div>
    <div class="w-full bg-gray-100 rounded-full h-2 mb-5">
      <div id="progress-bar" class="bg-blue-600 h-2 rounded-full" style="width:0%"></div>
    </div>

    <div id="prompt-box" class="text-base font-medium mb-5 whitespace-pre-line"></div>
    <div id="answer-area" class="mb-4"></div>

    <button id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-base mb-3">
      제출
    </button>

    <div id="feedback-box" class="hidden">
      <div id="feedback-result" class="text-base font-bold mb-2"></div>
      <div id="feedback-correct" class="text-sm text-gray-700 mb-2"></div>
      <div id="feedback-explanation" class="text-sm text-gray-500 mb-4"></div>
      <button id="next-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 rounded-xl text-base">
        다음 문제
      </button>
    </div>
    <p id="question-error" class="text-sm text-red-600 mt-3 hidden"></p>
  </div>

  <div id="result-screen" class="hidden">
    <h2 class="text-xl font-bold mb-1 text-center">결과</h2>
    <p id="result-summary" class="text-center text-gray-600 mb-2"></p>
    <p id="result-level-info" class="text-center text-xs text-gray-400 mb-6"></p>
    <div id="result-by-type" class="space-y-2 mb-6"></div>
    <div id="result-wrong" class="space-y-3 mb-6"></div>
    <button id="restart-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 rounded-xl text-base">
      다시 풀기
    </button>
  </div>
</div>

<script>
(function () {
  const API = "/api/vocabulary-quiz";
  let sessionId = null;
  let currentItem = null;
  let crosswordCellInputs = {};  // "row,col" -> <input> - 방향키 이동/제출 수집/채점 표시에 재사용

  const setupScreen = document.getElementById("setup-screen");
  const questionScreen = document.getElementById("question-screen");
  const resultScreen = document.getElementById("result-screen");

  const setupError = document.getElementById("setup-error");
  const questionError = document.getElementById("question-error");

  function showError(el, msg) {
    el.textContent = msg;
    el.classList.remove("hidden");
  }
  function hideError(el) {
    el.classList.add("hidden");
  }

  async function api(path, options) {
    const res = await fetch(API + path, Object.assign({
      headers: { "Content-Type": "application/json" },
    }, options));
    let data = null;
    try { data = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      let detail = (data && data.detail) ? data.detail : ("HTTP " + res.status);
      if (detail && typeof detail === "object") {
        // 후보 부족(INSUFFICIENT_LEVEL_CANDIDATES) 등 구조화된 오류 - 사람이 읽을 문장으로 변환
        detail = detail.code === "INSUFFICIENT_LEVEL_CANDIDATES"
          ? `요청한 ${detail.requested}문항 중 ${detail.available}문항만 현재 조건(레벨 ${detail.level})에 맞습니다.`
          : JSON.stringify(detail);
      }
      throw new Error(detail);
    }
    return data;
  }

  // ---------- 레벨별 출제(v1, 관리자 전용) ----------
  const levelSelect = document.getElementById("level-select");
  const confidenceField = document.getElementById("confidence-field");
  const availabilityInfo = document.getElementById("availability-info");
  const levelWarningBadge = document.getElementById("level-warning-badge");
  const startBtn = document.getElementById("start-btn");
  let lastAvailability = null;

  // ---------- L4·L5 파일럿(v1, phase18) - 완전히 별도 경로, 위 레벨별 출제 로직은 건드리지 않는다 ----------
  const pilotModeCheckbox = document.getElementById("pilot-mode-checkbox");
  const levelScopeFields = document.getElementById("level-scope-fields");

  function isPilotMode() {
    return !!(pilotModeCheckbox && pilotModeCheckbox.checked);
  }

  function selectedLevel() {
    return levelSelect.value === "" ? null : parseInt(levelSelect.value, 10);
  }
  function selectedConfidenceMode() {
    const checked = document.querySelector('input[name="confidence-mode"]:checked');
    return checked ? checked.value : "all_candidates";
  }

  async function refreshAvailability() {
    if (isPilotMode()) {
      const types = Array.from(document.querySelectorAll(".type-checkbox:checked:not(:disabled)")).map(el => el.value);
      const params = new URLSearchParams();
      types.forEach(t => params.append("item_type", t));
      try {
        const data = await api(`/pilot-availability?${params.toString()}`);
        lastAvailability = data;
        availabilityInfo.textContent =
          `파일럿 가용 문항: ${data.available_items}개 · 고유 어휘: ${data.distinct_words}개`;
        levelWarningBadge.classList.add("hidden");
        document.querySelectorAll(".type-count").forEach(el => {
          const t = el.dataset.typeCount;
          el.textContent = (data.by_type && t in data.by_type) ? `${data.by_type[t] || 0}문항` : "";
        });
        updateStartButton();
      } catch (e) {
        availabilityInfo.textContent = "";
        showError(setupError, e.message);
      }
      return;
    }
    const level = selectedLevel();
    const types = Array.from(document.querySelectorAll(".type-checkbox:checked:not(:disabled)")).map(el => el.value);
    const params = new URLSearchParams();
    if (level !== null) params.set("level", String(level));
    params.set("confidence_mode", selectedConfidenceMode());
    types.forEach(t => params.append("item_type", t));
    try {
      const data = await api(`/availability?${params.toString()}`);
      lastAvailability = data;
      if (level === null) {
        availabilityInfo.textContent = "";
        levelWarningBadge.classList.add("hidden");
      } else {
        availabilityInfo.textContent =
          `현재 조건 가용 문항: ${data.available_items}개 · 고유 어휘: ${data.distinct_words}개`;
        if (data.available_items > 0 && data.distinct_words <= 5) {
          levelWarningBadge.textContent = "표본 부족 - 이 조건은 문항 수가 매우 적습니다. 전체 후보로 바꾸거나 다른 레벨을 시험해 보세요.";
          levelWarningBadge.classList.remove("hidden");
        } else {
          levelWarningBadge.classList.add("hidden");
        }
      }
      document.querySelectorAll(".type-count").forEach(el => {
        const t = el.dataset.typeCount;
        if (level === null || !(data.by_type && t in data.by_type)) { el.textContent = ""; return; }
        el.textContent = `${data.by_type[t] || 0}문항`;
      });
      updateStartButton();
    } catch (e) {
      availabilityInfo.textContent = "";
      showError(setupError, e.message);
    }
  }

  function updateStartButton() {
    const questionCount = parseInt(document.getElementById("question-count").value, 10) || 0;
    if ((isPilotMode() || selectedLevel() !== null) && lastAvailability) {
      startBtn.disabled = questionCount > lastAvailability.available_items || lastAvailability.available_items === 0;
      startBtn.classList.toggle("opacity-40", startBtn.disabled);
      startBtn.classList.toggle("cursor-not-allowed", startBtn.disabled);
    } else {
      startBtn.disabled = false;
      startBtn.classList.remove("opacity-40", "cursor-not-allowed");
    }
  }

  if (pilotModeCheckbox) {
    pilotModeCheckbox.addEventListener("change", () => {
      if (isPilotMode()) {
        // 파일럿 모드는 레벨/신뢰도 선택과 무관한 완전히 별도 경로 - 해당 필드는
        // 숨기고 값도 서버에 보내지 않는다(start-btn 핸들러 참고).
        levelScopeFields.classList.add("hidden");
        confidenceField.classList.add("hidden");
        levelWarningBadge.classList.add("hidden");
        const crosswordCb = typeCheckboxes.find(x => x.value === "CROSSWORD");
        if (crosswordCb) { crosswordCb.checked = false; crosswordCb.disabled = true; }
        crosswordNotice.textContent = "파일럿 모드는 십자말을 지원하지 않습니다.";
        crosswordNotice.classList.remove("hidden");
      } else {
        levelScopeFields.classList.remove("hidden");
        if (selectedLevel() === null) {
          const crosswordCb = typeCheckboxes.find(x => x.value === "CROSSWORD");
          if (crosswordCb) crosswordCb.disabled = false;
          crosswordNotice.classList.add("hidden");
        }
      }
      questionCountField.classList.remove("hidden");
      refreshAvailability();
    });
  }

  levelSelect.addEventListener("change", () => {
    const level = selectedLevel();
    const crosswordCb = typeCheckboxes.find(x => x.value === "CROSSWORD");
    if (level !== null) {
      confidenceField.classList.remove("hidden");
      if (crosswordCb) {
        crosswordCb.checked = false;
        crosswordCb.disabled = true;
      }
      crosswordNotice.textContent = "레벨을 선택하면 십자말은 다음 단계에서 지원됩니다.";
      crosswordNotice.classList.remove("hidden");
      questionCountField.classList.remove("hidden");
    } else {
      confidenceField.classList.add("hidden");
      levelWarningBadge.classList.add("hidden");
      availabilityInfo.textContent = "";
      if (crosswordCb) crosswordCb.disabled = false;
      crosswordNotice.classList.add("hidden");
    }
    refreshAvailability();
  });
  document.querySelectorAll('input[name="confidence-mode"]').forEach(r => r.addEventListener("change", refreshAvailability));
  document.getElementById("question-count").addEventListener("input", updateStartButton);

  // CROSSWORD는 단독 모드 전용(서버도 400으로 거부한다) - 체크하면 다른 유형은 자동
  // 해제·비활성화하고 문항 수 선택기를 숨긴다. 다른 유형을 고르면 반대로 CROSSWORD를 끈다.
  const typeCheckboxes = Array.from(document.querySelectorAll(".type-checkbox"));
  const questionCountField = document.getElementById("question-count-field");
  const crosswordNotice = document.getElementById("crossword-notice");
  typeCheckboxes.forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.value === "CROSSWORD" && cb.checked) {
        typeCheckboxes.forEach(other => {
          if (other !== cb) { other.checked = false; other.disabled = true; }
        });
        questionCountField.classList.add("hidden");
        crosswordNotice.textContent = "십자말은 항상 1세트가 출제됩니다.";
        crosswordNotice.classList.remove("hidden");
      } else if (cb.value === "CROSSWORD" && !cb.checked) {
        typeCheckboxes.forEach(other => { other.disabled = false; });
        questionCountField.classList.remove("hidden");
        crosswordNotice.classList.add("hidden");
      } else if (cb.checked) {
        const crosswordCb = typeCheckboxes.find(x => x.value === "CROSSWORD");
        if (crosswordCb && selectedLevel() === null) { crosswordCb.checked = false; crosswordCb.disabled = false; }
        typeCheckboxes.forEach(other => { if (other.value !== "CROSSWORD" || selectedLevel() === null) other.disabled = false; });
        if (selectedLevel() === null) questionCountField.classList.remove("hidden");
        if (selectedLevel() === null) crosswordNotice.classList.add("hidden");
      }
      refreshAvailability();
    });
  });

  document.getElementById("start-btn").addEventListener("click", async () => {
    hideError(setupError);
    const types = Array.from(document.querySelectorAll(".type-checkbox:checked")).map(el => el.value);
    const questionCount = parseInt(document.getElementById("question-count").value, 10) || {{ default_question_count }};
    const pilotMode = isPilotMode();
    const level = pilotMode ? null : selectedLevel();
    try {
      const body = { item_types: types.length ? types : null, question_count: questionCount };
      if (pilotMode) {
        body.pilot_mode = true;
      } else if (level !== null) {
        body.selected_vocab_level = level;
        body.confidence_mode = selectedConfidenceMode();
      }
      const data = await api("/sessions", { method: "POST", body: JSON.stringify(body) });
      sessionId = data.session_id;
      setupScreen.classList.add("hidden");
      questionScreen.classList.remove("hidden");
      await loadNext();
    } catch (e) {
      showError(setupError, e.message);
    }
  });

  async function loadNext() {
    hideError(questionError);
    document.getElementById("feedback-box").classList.add("hidden");
    document.getElementById("submit-btn").classList.remove("hidden");
    const data = await api(`/sessions/${sessionId}/next`);
    if (data.done) {
      await showResult();
      return;
    }
    currentItem = data.item;
    renderProgress(data.progress);
    renderQuestion(currentItem);
  }

  function renderProgress(progress) {
    document.getElementById("progress-label").textContent = `${progress.answered + 1} / ${progress.total}`;
    document.getElementById("progress-bar").style.width = `${(progress.answered / progress.total) * 100}%`;
  }

  const TYPE_LABELS = {
    MEANING_CHOICE: "낱말 → 뜻", WORD_FROM_DEFINITION: "뜻 → 낱말", CONTEXT_MEANING: "문맥 속 의미",
    CONTEXT_CLOZE: "문맥 빈칸(직접 입력)", MATCH_WORD_MEANING: "네 쌍 연결", CROSSWORD: "십자말풀이",
  };

  function renderQuestion(item) {
    document.getElementById("type-label").textContent = TYPE_LABELS[item.item_type] || item.item_type;
    document.getElementById("prompt-box").textContent = item.prompt;
    const area = document.getElementById("answer-area");
    area.innerHTML = "";

    if (["MEANING_CHOICE", "WORD_FROM_DEFINITION", "CONTEXT_MEANING"].includes(item.item_type)) {
      item.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn w-full text-left border rounded-lg px-4 py-3 mb-2 text-sm hover:bg-gray-50";
        btn.textContent = `${idx + 1}. ${opt}`;
        btn.dataset.value = String(idx + 1);
        btn.addEventListener("click", () => {
          area.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("border-blue-600", "bg-blue-50"));
          btn.classList.add("border-blue-600", "bg-blue-50");
        });
        area.appendChild(btn);
      });
    } else if (item.item_type === "CONTEXT_CLOZE") {
      const hint = document.createElement("p");
      hint.className = "text-xs text-gray-400 mb-2";
      hint.textContent = item.input_hint ? `힌트: ${item.input_hint}` : "";
      const input = document.createElement("input");
      input.type = "text";
      input.id = "cloze-input";
      input.className = "border rounded-lg px-3 py-2 w-full text-sm mb-2";
      input.placeholder = "빈칸에 들어갈 낱말을 입력하세요";

      const hintBtn = document.createElement("button");
      hintBtn.type = "button";
      hintBtn.id = "choseong-hint-btn";
      hintBtn.className = "text-xs text-blue-600 hover:underline mb-1";
      hintBtn.textContent = "초성힌트보기";

      const choseongDisplay = document.createElement("p");
      choseongDisplay.id = "choseong-hint-display";
      choseongDisplay.className = "text-sm font-semibold text-blue-700 mb-2";

      const retryNotice = document.createElement("p");
      retryNotice.id = "cloze-retry-notice";
      retryNotice.className = "text-sm text-amber-600 mb-2 hidden";

      hintBtn.addEventListener("click", async () => {
        try {
          const data = await api(`/sessions/${sessionId}/hint`, {
            method: "POST", body: JSON.stringify({ item_id: currentItem.item_id }),
          });
          choseongDisplay.textContent = `초성 힌트: ${data.choseong_hint}`;
        } catch (e) {
          showError(questionError, e.message);
        }
      });

      area.appendChild(hint);
      area.appendChild(input);
      area.appendChild(hintBtn);
      area.appendChild(choseongDisplay);
      area.appendChild(retryNotice);

      // 재접속 등으로 이미 1차 시도를 틀려 힌트가 공개된 상태로 돌아온 경우
      if (item.choseong_hint) {
        choseongDisplay.textContent = `초성 힌트: ${item.choseong_hint}`;
      }
      if (item.attempt_count > 0) {
        retryNotice.textContent = `아쉬워요! 초성 힌트를 보고 한 번 더 시도해 보세요. (남은 기회 ${item.attempts_left}회)`;
        retryNotice.classList.remove("hidden");
      }
    } else if (item.item_type === "MATCH_WORD_MEANING") {
      item.words.forEach(word => {
        const row = document.createElement("div");
        row.className = "flex items-center gap-2 mb-2";
        const label = document.createElement("div");
        label.className = "w-24 shrink-0 text-sm font-semibold";
        label.textContent = word;
        const select = document.createElement("select");
        select.className = "match-select border rounded-lg px-2 py-2 text-sm flex-1";
        select.dataset.word = word;
        select.innerHTML = '<option value="">뜻을 선택하세요</option>' +
          item.definitions.map(d => `<option value="${escapeAttr(d)}">${escapeHtml(d)}</option>`).join("");
        row.appendChild(label);
        row.appendChild(select);
        area.appendChild(row);
      });
    } else if (item.item_type === "CROSSWORD") {
      renderCrosswordGrid(item, area);
    }
  }

  function renderCrosswordGrid(item, area) {
    crosswordCellInputs = {};
    const activeCells = new Set(item.cells.map(c => `${c.row},${c.col}`));
    const numberByCell = {};
    item.cells.forEach(c => { if (c.number) numberByCell[`${c.row},${c.col}`] = c.number; });

    const wrap = document.createElement("div");
    wrap.className = "overflow-x-auto mb-4 pb-2";
    const grid = document.createElement("div");
    grid.style.display = "grid";
    grid.style.gridTemplateRows = `repeat(${item.rows}, minmax(28px, 36px))`;
    grid.style.gridTemplateColumns = `repeat(${item.cols}, minmax(28px, 36px))`;
    grid.style.gap = "2px";
    grid.style.width = "max-content";

    for (let r = 0; r < item.rows; r++) {
      for (let c = 0; c < item.cols; c++) {
        const key = `${r},${c}`;
        const cellWrap = document.createElement("div");
        cellWrap.style.position = "relative";
        if (activeCells.has(key)) {
          const input = document.createElement("input");
          input.type = "text";
          input.maxLength = 1;
          input.className = "crossword-cell w-full h-full text-center border border-gray-300 rounded-sm " +
            "text-sm font-semibold focus:border-blue-500 focus:outline-none";
          input.style.width = "100%";
          input.style.height = "100%";
          input.dataset.row = String(r);
          input.dataset.col = String(c);
          input.addEventListener("keydown", (ev) => handleCrosswordKeydown(ev, r, c));
          input.addEventListener("input", () => {
            input.value = input.value.slice(-1);
          });
          crosswordCellInputs[key] = input;
          cellWrap.appendChild(input);

          if (numberByCell[key]) {
            const numLabel = document.createElement("span");
            numLabel.textContent = numberByCell[key];
            numLabel.style.position = "absolute";
            numLabel.style.top = "0px";
            numLabel.style.left = "2px";
            numLabel.style.fontSize = "9px";
            numLabel.style.color = "#2563eb";
            numLabel.style.pointerEvents = "none";
            cellWrap.appendChild(numLabel);
          }
        }
        grid.appendChild(cellWrap);
      }
    }
    wrap.appendChild(grid);
    area.appendChild(wrap);

    const clueWrap = document.createElement("div");
    clueWrap.className = "grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm";
    ["across", "down"].forEach(direction => {
      const col = document.createElement("div");
      const heading = document.createElement("p");
      heading.className = "font-semibold text-gray-700 mb-1";
      heading.textContent = direction === "across" ? "가로" : "세로";
      col.appendChild(heading);
      item.entries.filter(e => e.direction === direction).sort((a, b) => a.number - b.number).forEach(e => {
        const line = document.createElement("p");
        line.className = "text-gray-600 mb-1 cursor-pointer hover:text-blue-600";
        line.textContent = `${e.number}. ${e.clue} (${e.length}자)`;
        line.addEventListener("click", () => {
          const target = crosswordCellInputs[`${e.row},${e.col}`];
          if (target) target.focus();
        });
        col.appendChild(line);
      });
      clueWrap.appendChild(col);
    });
    area.appendChild(clueWrap);
  }

  function handleCrosswordKeydown(ev, row, col) {
    const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    const move = moves[ev.key];
    if (!move) return;
    ev.preventDefault();
    const target = crosswordCellInputs[`${row + move[0]},${col + move[1]}`];
    if (target) target.focus();
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function escapeAttr(s) { return escapeHtml(s); }

  function collectAnswerBody(item) {
    if (["MEANING_CHOICE", "WORD_FROM_DEFINITION", "CONTEXT_MEANING"].includes(item.item_type)) {
      const selected = document.querySelector(".choice-btn.border-blue-600");
      if (!selected) return null;
      return { item_id: item.item_id, selected_option: parseInt(selected.dataset.value, 10) };
    }
    if (item.item_type === "CONTEXT_CLOZE") {
      const val = document.getElementById("cloze-input").value.trim();
      if (!val) return null;
      return { item_id: item.item_id, answer_text: val };
    }
    if (item.item_type === "MATCH_WORD_MEANING") {
      const selects = Array.from(document.querySelectorAll(".match-select"));
      if (selects.some(s => !s.value)) return null;
      const answers = {};
      selects.forEach(s => { answers[s.dataset.word] = s.value; });
      return { item_id: item.item_id, answers };
    }
    if (item.item_type === "CROSSWORD") {
      const entries = Object.entries(crosswordCellInputs);
      if (entries.some(([, input]) => !input.value.trim())) return null;  // 미입력 칸이 있으면 제출 방지
      const cells = {};
      entries.forEach(([key, input]) => { cells[key] = input.value.trim(); });
      return { item_id: item.item_id, cells };
    }
    return null;
  }

  document.getElementById("submit-btn").addEventListener("click", async () => {
    hideError(questionError);
    const body = collectAnswerBody(currentItem);
    if (!body) {
      showError(questionError, "답을 모두 선택/입력해 주세요.");
      return;
    }
    try {
      const data = await api(`/sessions/${sessionId}/answer`, { method: "POST", body: JSON.stringify(body) });
      if (data.retry_available) {
        renderRetry(data);
      } else {
        renderFeedback(data);
      }
    } catch (e) {
      showError(questionError, e.message);
    }
  });

  function renderRetry(data) {
    // 문맥빈칸 1차 시도 오답 - 확정하지 않고 초성 힌트를 보여준 뒤 같은 문항을 다시 풀게 한다.
    const notice = document.getElementById("cloze-retry-notice");
    notice.textContent = `아쉬워요! 초성 힌트를 보고 한 번 더 시도해 보세요. (남은 기회 ${data.attempts_left}회)`;
    notice.classList.remove("hidden");
    document.getElementById("choseong-hint-display").textContent = `초성 힌트: ${data.choseong_hint}`;
    const input = document.getElementById("cloze-input");
    input.value = "";
    input.focus();
  }

  function renderFeedback(data) {
    document.getElementById("submit-btn").classList.add("hidden");
    if (currentItem.item_type === "CONTEXT_CLOZE") {
      // 확정됐으면(정답이거나 2차 시도까지 끝났으면) 재시도 안내/입력을 정리해 최종 피드백만 보이게 한다.
      const notice = document.getElementById("cloze-retry-notice");
      if (notice) notice.classList.add("hidden");
      const input = document.getElementById("cloze-input");
      if (input) input.disabled = true;
      const hintBtn = document.getElementById("choseong-hint-btn");
      if (hintBtn) hintBtn.disabled = true;
    }
    if (currentItem.item_type === "CROSSWORD") {
      Object.entries(crosswordCellInputs).forEach(([key, input]) => {
        input.disabled = true;
        const ok = data.cell_results ? data.cell_results[key] : null;
        input.style.background = ok === true ? "#dcfce7" : ok === false ? "#fee2e2" : "";
        input.style.color = ok === true ? "#166534" : ok === false ? "#991b1b" : "";
      });
    }

    const box = document.getElementById("feedback-box");
    box.classList.remove("hidden");
    const resultEl = document.getElementById("feedback-result");
    if (currentItem.item_type === "MATCH_WORD_MEANING" || currentItem.item_type === "CROSSWORD") {
      const unit = currentItem.item_type === "CROSSWORD" ? "칸" : "쌍";
      resultEl.textContent = `${data.correct_count} / ${data.total_count} ${unit} 정답`;
      resultEl.className = data.is_correct ? "text-base font-bold mb-2 text-green-600" : "text-base font-bold mb-2 text-amber-600";
    } else {
      resultEl.textContent = data.is_correct ? "정답이에요!" : "틀렸어요";
      resultEl.className = "text-base font-bold mb-2 " + (data.is_correct ? "text-green-600" : "text-red-600");
    }

    const correctEl = document.getElementById("feedback-correct");
    const ca = data.correct_answer;
    if (currentItem.item_type === "MATCH_WORD_MEANING") {
      correctEl.textContent = "정답: " + Object.entries(ca.answers).map(([w, d]) => `${w}=${d}`).join(" / ");
    } else if (currentItem.item_type === "CONTEXT_CLOZE") {
      correctEl.textContent = "정답: " + ca.answer_text;
    } else if (currentItem.item_type === "CROSSWORD") {
      correctEl.textContent = "정답: " + ca.entries
        .sort((a, b) => a.number - b.number)
        .map(e => `${e.number}${e.direction === "across" ? "가로" : "세로"}=${e.answer}`)
        .join(" / ");
    } else {
      correctEl.textContent = "정답: " + ca.correct_text;
    }
    document.getElementById("feedback-explanation").textContent = data.explanation || "";
  }

  document.getElementById("next-btn").addEventListener("click", loadNext);

  async function showResult() {
    questionScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");
    const data = await api(`/sessions/${sessionId}/result`);
    document.getElementById("result-summary").textContent =
      `${data.correct} / ${data.total} 정답 (${data.accuracy}%)`;

    const levelInfoEl = document.getElementById("result-level-info");
    const li = data.level_info;
    const pi = data.pilot_info;
    if (pi) {
      levelInfoEl.textContent = `L4·L5 파일럿(phase18) · 후보 ${pi.candidate_count}문항`;
    } else {
      levelInfoEl.textContent = li
        ? `L${li.selected_vocab_level} ${li.grade_label} · ${li.confidence_mode === "auto_only" ? "고신뢰도만" : "전체 후보"} · ${li.level_version} · 후보 ${li.candidate_count}문항`
        : "레벨 미지정(전체 모드)";
    }

    const byType = document.getElementById("result-by-type");
    byType.innerHTML = "";
    Object.entries(data.by_type).forEach(([type, stats]) => {
      const row = document.createElement("div");
      row.className = "flex justify-between text-sm border rounded-lg px-3 py-2";
      row.innerHTML = `<span>${TYPE_LABELS[type] || type}</span><span>${stats.correct}/${stats.total} (${stats.accuracy}%)</span>`;
      byType.appendChild(row);
    });

    const wrongBox = document.getElementById("result-wrong");
    wrongBox.innerHTML = "";
    if (data.wrong_items.length) {
      const heading = document.createElement("p");
      heading.className = "text-sm font-semibold text-gray-700";
      heading.textContent = "다시 볼 문제";
      wrongBox.appendChild(heading);
      data.wrong_items.forEach(w => {
        const card = document.createElement("div");
        card.className = "border rounded-lg px-3 py-2 text-sm";
        card.innerHTML = `<div class="font-medium mb-1">${escapeHtml(w.prompt || "")}</div>` +
          `<div class="text-gray-500">${escapeHtml(w.explanation || "")}</div>`;
        wrongBox.appendChild(card);
      });
    }
  }

  document.getElementById("restart-btn").addEventListener("click", () => {
    resultScreen.classList.add("hidden");
    setupScreen.classList.remove("hidden");
    sessionId = null;
    currentItem = null;
  });
})();
</script>
{% endblock %}
