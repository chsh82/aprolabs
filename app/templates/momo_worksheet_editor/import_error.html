{% extends "base.html" %}
{% block title %}프로젝트 불러오기 실패 - Aprolabs{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-10">
  <div class="bg-red-50 border border-red-200 rounded-xl p-6">
    <h2 class="text-lg font-bold text-red-800 mb-2">프로젝트를 불러올 수 없습니다</h2>
    <p class="text-sm text-red-700">{{ error }}</p>
    <p class="text-xs text-red-500 mt-3">
      손상되었거나 자산 파일이 누락된 내보내기 파일입니다. 기존에 열려 있던 다른 편집
      프로젝트는 이 오류와 무관하게 그대로 보존되어 있습니다.
    </p>
    <a href="/momo-worksheet-editor" class="inline-block mt-4 text-sm text-blue-600 hover:underline">← 프로젝트 목록으로</a>
  </div>
</div>
{% endblock %}
