<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>수에즈 운하</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f6ecd6; --paper-dim:#c3ac86; --geum:#c9a227; --injoo:#a8322d; --ink:#3a2c1c; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1100px 700px at 50% -15%, #4a3a24 0%, transparent 62%), #1b150e;
    color:var(--paper);font-family:"Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;user-select:none;
  }
  .frame{
    width:min(980px,100%);height:min(700px,100vh - 32px);
    display:flex;flex-direction:column;border:1px solid rgba(201,162,39,.3);
    background:rgba(20,15,9,.6);position:relative;overflow:hidden;
  }
  .clock{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-right:14px;
         border-right:1px solid rgba(201,162,39,.22)}
  .clock svg{display:block}
  .clock b{font-family:"Noto Serif KR",serif;font-weight:900;font-size:20px;
           line-height:1;font-variant-numeric:tabular-nums;color:#f6ecd6}
  .clock em{font-style:normal;font-size:10.5px;opacity:.7;display:block;margin-top:2px;letter-spacing:.08em}
  .gauges{flex:0 0 auto;display:flex;align-items:center;gap:18px;
          padding:10px 18px;border-bottom:1px solid rgba(201,162,39,.22)}
  .stam{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .stam i{width:10px;height:10px;border-radius:50%;background:var(--geum);display:block;transition:opacity .25s}
  .stam i.spent{opacity:.15}
  .stam span{font-size:11px;color:var(--paper-dim);margin-left:3px}
  .track{flex:1 1 auto;min-width:0}
  .track .lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--paper-dim);margin-bottom:4px;letter-spacing:.06em}
  .track .bar{height:4px;background:rgba(255,255,255,.09);position:relative}
  .track .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--geum);width:0;transition:width .3s}
  .score{flex:0 0 auto;text-align:right;font-size:11px;color:var(--paper-dim);line-height:1.5}
  .score b{display:block;font-family:"Noto Serif KR",serif;font-size:16px;color:var(--geum);font-variant-numeric:tabular-nums}

  .qbar{flex:0 0 auto;padding:14px 22px 13px;border-bottom:1px solid rgba(201,162,39,.16);
        background:linear-gradient(180deg, rgba(201,162,39,.06), transparent);
        min-height:72px;display:flex;align-items:center}
  .qbar p{font-family:"Noto Serif KR",serif;font-size:19px;line-height:1.55;max-width:56ch;margin:0 auto;text-align:center}
  .qbar p small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:11.5px;
                color:var(--paper-dim);letter-spacing:.06em;margin-bottom:5px}

  .stage{position:relative;flex:1 1 auto;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}

  .overlay{position:absolute;inset:0;background:rgba(20,15,9,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px 26px;gap:10px;z-index:5;overflow-y:auto}
  .overlay.hidden{display:none}
  .title{font-family:"Noto Serif KR",serif;font-weight:900;font-size:37px;letter-spacing:.12em;line-height:1.15}
  .title em{display:block;font-style:normal;font-size:13.5px;letter-spacing:.38em;color:var(--geum);margin-bottom:12px;font-weight:400}
  .rules{margin:20px 0 24px;font-size:14px;line-height:1.95;color:var(--paper-dim);max-width:44ch}
  .rules b{color:var(--paper);font-weight:500}
  .big{font-family:"Noto Serif KR",serif;font-weight:900;font-size:38px;color:var(--geum);line-height:1.15}
  .sub{font-family:"Noto Serif KR",serif;font-size:17px;line-height:1.7;max-width:44ch;color:var(--paper-dim)}
  .sub b{color:var(--paper);font-weight:600}
  .review{margin:18px 0 20px;width:min(470px,100%);text-align:left;
          border-top:1px solid rgba(201,162,39,.25);padding-top:13px}
  .review h3{font-size:12.5px;font-weight:500;color:var(--geum);margin-bottom:10px}
  .review li{list-style:none;padding:7px 0;border-bottom:1px solid rgba(246,236,214,.08);
             font-size:13.5px;line-height:1.55;color:var(--paper-dim)}
  .review li b{color:var(--paper);font-family:"Noto Serif KR",serif;font-weight:600}
  .go{font-family:inherit;font-size:15px;padding:13px 38px;background:transparent;
      color:var(--geum);border:1px solid var(--geum);cursor:pointer;letter-spacing:.08em;transition:.15s}
  .go:hover,.go:focus-visible{background:var(--geum);color:var(--ink)}
  button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
  @media (max-width:640px){ .qbar p{font-size:16.5px} .title{font-size:28px} .big{font-size:30px} }
</style>
</head>
<body>

<div class="frame">
  <div class="gauges">
    <div class="clock">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="14" r="9.4" fill="none" stroke="#c9a227" stroke-width="1.6"/>
        <rect x="11" y="1.6" width="4" height="3.4" fill="#c9a227"/>
        <rect x="12.2" y="4.4" width="1.6" height="1.8" fill="#c9a227"/>
        <line id="hand" x1="13" y1="14" x2="13" y2="8" stroke="#f6ecd6" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="13" cy="14" r="1.2" fill="#f6ecd6"/>
      </svg>
      <div><b id="clockN">0:00</b><em>걸린 시간</em></div>
    </div>
    <div class="stam" id="stam"><i></i><i></i><i></i><span>선체</span></div>
    <div class="track">
      <div class="lbl"><span>포트사이드</span><span>수에즈</span></div>
      <div class="bar"><i id="prog"></i></div>
    </div>
    <div class="score"><b id="scoreN">0</b>바른 수로</div>
    <div class="score"><b id="saveN">0</b>구조</div>
  </div>

  <div class="qbar"><p id="qText"></p></div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="overlay" id="start">
      <h1 class="title"><em>80일간의 어휘 일주 · 수에즈</em>운하 통과</h1>
      <div class="rules">
        위에서 내려다본 운하를 배로 지납니다.<br>
        <b>↑ ↓</b> 로 키를 잡습니다. 배는 <b>천천히 돌아갑니다.</b><br>
        갈림목이 나오면 뜻에 맞는 <b>표지가 선 수로</b>로 들어가세요.<br>
        부표 열은 트인 곳으로, 준설선은 반대편으로 지납니다.<br>
        돛단배는 떠다니고, 좁아지는 수로에서는 가운데로.<br>
        <b>튜브를 낀 조난자</b>를 지나며 건져 올리면 점수가 오르고,<br>
        셋을 구할 때마다 선체가 하나 수리됩니다.
      </div>
      <button class="go" id="startBtn">키를 잡다</button>
    </div>

    <div class="overlay hidden" id="endScreen">
      <div class="big" id="endBig"></div>
      <div class="sub" id="endSub"></div>
      <div class="review" id="reviewBox"></div>
      <button class="go" id="againBtn">다시 항해</button>
    </div>

    <div class="overlay hidden" id="loading">
      <div class="sub">문항을 불러오는 중…</div>
    </div>

    <div class="overlay hidden" id="loadError">
      <div class="big">불러오지 못했습니다</div>
      <div class="sub" id="loadErrorMsg"></div>
      <button class="go" id="retryBtn">다시 시도</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   문항 — GET /vocab/quiz?format=gate3&count=6&level=<학년> 연동
   학년은 URL 쿼리스트링(?level=)에서 받고, 없으면 7(중1)
   ════════════════════════════════════════════ */
let ITEMS = [];
async function loadItems(){
  const level = new URLSearchParams(location.search).get('level') || 7;
  const r = await fetch(`/vocab/quiz?format=gate3&count=6&level=${level}`);
  if(!r.ok) throw new Error('서버 응답 오류(' + r.status + ')');
  const data = await r.json();
  if(!data.items || data.items.length === 0){
    throw new Error(data.note || '지금은 문항을 받을 수 없습니다');
  }
  ITEMS = data.items;
}

/* ════════════════════════════════════════════
   학습 기록 — 문항 판정마다 쌓아 두었다가 게임이 끝날 때 한 번에 전송
   ════════════════════════════════════════════ */
const STUDENT_ID = new URLSearchParams(location.search).get('student_id') || 'test_01';
let attempts = [];
let questionShownAt = 0;
async function sendAttempts(){
  if(!attempts.length) return;
  const batch = attempts.splice(0, attempts.length);
  try {
    await fetch(`/vocab/attempt?student_id=${encodeURIComponent(STUDENT_ID)}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(batch)
    });
  } catch(err){
    console.warn('학습 기록 전송 실패', err);
  }
}

/* ════════════════════════════════════════════
   무대 — 가로 구도. 배는 왼쪽, 물길은 오른쪽에서 흘러온다
   ════════════════════════════════════════════ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W=0, H=0, SHIPX=0, MID=0, AHEAD=0, HW=130, AMP=1;

function resize(){
  const dpr = window.devicePixelRatio || 1;
  W = stage.clientWidth; H = stage.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  SHIPX = Math.round(W*0.18);
  MID   = Math.round(H*0.50);
  AHEAD = W - SHIPX + 220;                // 내다보이는 거리 (오른쪽 화면 밖까지)
  HW    = Math.min(132, H*0.24);          // 수로 반너비
  AMP   = Math.min(1, (H*0.5 - HW - 26) / 74);
}
window.addEventListener('resize', resize);
resize();

const ISL = 54;                            // 갈림목 모래섬 중심
const centerline = d => (Math.sin(d*0.0021)*44 + Math.sin(d*0.0009 + 1.2)*30) * AMP;

/* ── 상태 ────────────────────────────────── */
let course = [], dist = 0, speed = 195;
let off = 0, head = 0;
let stam = 3, score = 0, saved = 0, qi = 0;
let playing = false, missed = [];
let toast = null, toastT = 0, wake = [], t = 0, shake = 0, groundT = 0;
let fx = [];                       // 사라지는 효과 (물길 좌표로 저장)

function burst(d, off, color, n, spread){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = rnd(40, spread);
    fx.push({ d, off, vd:Math.cos(a)*v, voff:Math.sin(a)*v, a:1, c:color, r:rnd(2,4) });
  }
}
function floatText(d, off, text, color){
  fx.push({ d, off, text, a:1, vd:26, voff:-46, c:color });
}
function ring(d, off, color){
  fx.push({ d, off, a:1, c:color, ring:true, r:14 });
}
let lastTs = 0, rafId = null;
const keys = {};

const rnd = (a,b) => a + Math.random()*(b-a);
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

/* ── 항로 짜기 ───────────────────────────── */
const SPAN  = 300;    // 갈림목 길이
const LEAD  = 720;    // 표지판 앞으로 비워 두는 거리 (읽고 키를 잡을 구간)
const AFTER = 460;    // 갈림목을 빠져나온 뒤 비워 두는 거리
const ZONE  = 1700;   // 장애물이 놓이는 구간
const GAP   = 300;    // 장애물끼리의 최소 간격

let narrows = [];     // 수로가 좁아지는 구간

/* 장애물 넷 — 모두 반드시 지나갈 길이 남는다
   buoys   부표 열 · 한 곳만 트여 있다
   barge   준설선 · 한쪽 기슭에 붙어 있다
   felucca 돛단배 · 좌우로 떠다닌다
   narrow  좁아지는 수로 · 가운데로 지나야 한다            */
function makeObstacle(d){
  const r = Math.random();
  if(r < 0.34){
    const gap = rnd(-HW*0.52, HW*0.52) * AMP;      // 트인 자리
    const line = [];
    for(let o = -HW*0.86; o <= HW*0.86; o += HW*0.29){
      if(Math.abs(o*AMP - gap) < 46) continue;     // 통로는 비운다
      line.push(o*AMP);
    }
    return { type:'ob', kind:'buoys', d, len:40, gap, line };
  }
  if(r < 0.60){
    const side = Math.random() < .5 ? -1 : 1;
    return { type:'ob', kind:'barge', d, len:180, side,
             inner: side * HW * rnd(0.20, 0.34) * AMP };
  }
  if(r < 0.82){
    return { type:'ob', kind:'felucca', d, len:36,
             base: rnd(-HW*0.4, HW*0.4) * AMP, ph: Math.random()*6, amp: rnd(30, 52) };
  }
  return { type:'narrow', d, len:340, tight: HW*0.5 };
}

function buildCourse(){
  course = []; narrows = [];
  let d = 640;

  shuffle(ITEMS.slice()).forEach((item, gi) => {
    // 장애물 구간 — 두셋씩, 서로 충분히 벌려서
    const n = gi === 0 ? 3 : 4 + Math.floor(Math.random()*2);
    let od = d + 180;
    for(let k=0; k<n; k++){
      const o = makeObstacle(od);
      if(o.type === 'narrow') narrows.push(o);
      else course.push(o);
      od += Math.max(GAP, (o.len || 0) + 190) + rnd(0, 120);
      if(od > d + ZONE) break;
    }

    // 장애물 사이 빈 자리에 조난자를 띄운다
    const obD = course.filter(o => o.type === 'ob' && o.d > d).map(o => o.d).sort((a,b) => a-b);
    for(let i=0; i<obD.length-1; i++){
      if(Math.random() < 0.55) continue;
      course.push({
        type:'rescue',
        d: (obD[i] + obD[i+1]) / 2 + rnd(-40, 40),
        off: rnd(-HW*0.7, HW*0.7) * AMP,
        ph: Math.random()*6
      });
    }

    const signD = d + ZONE + LEAD;
    const forkD = signD + 34 + SPAN/2;
    const opts = shuffle([{text:item.a, ok:true}, ...item.w.map(x=>({text:x, ok:false}))]);
    course.push({ type:'fork', d:forkD, span:SPAN, item, opts });

    d = forkD + SPAN/2 + AFTER;
  });

  course.push({ type:'goal', d: d + 340 });
}

/* 좁아지는 구간을 반영한 수로 반너비 */
function hwAt(d){
  let hw = HW;
  narrows.forEach(n => {
    const k = (d - n.d) / (n.len/2);
    if(Math.abs(k) < 1) hw = Math.min(hw, HW - (HW - n.tight) * (1 - k*k));
  });
  return hw;
}

/* ── 판정 ────────────────────────────────── */
function updateHud(){
  [...document.getElementById('stam').children].forEach((el,i) => {
    if(el.tagName === 'I') el.classList.toggle('spent', i >= stam);
  });
  document.getElementById('prog').style.width = (qi/ITEMS.length*100) + '%';
  document.getElementById('scoreN').textContent = score;
  document.getElementById('saveN').textContent = saved;
}
function toastMsg(text, bad){ toast = {text, bad}; toastT = 1.7; }

function hurt(msg){
  stam--; shake = .5; groundT = .6; speed = 95;
  toastMsg(msg, true);
  updateHud();
  if(stam <= 0) end(false);
}

function setQuestion(item){
  if(item) questionShownAt = performance.now();
  document.getElementById('qText').innerHTML = item
    ? '<small>이 뜻에 맞는 표지의 수로로</small>' + item.mean
    : '<small>앞을 살피세요</small>운하를 빠져나갑니다';
}

function end(win){
  playing = false;
  cancelAnimationFrame(rafId);
  sendAttempts();
  document.getElementById('endBig').textContent = win ? '수에즈 도착' : '좌초';
  document.getElementById('endSub').innerHTML = win
    ? '운하를 빠져나와 홍해로 들어섭니다.<br>갈림목 ' + ITEMS.length + '곳 가운데 <b>' + score + '곳</b>을 바르게 지났고,<br>조난자 <b>' + saved + '명</b>을 건져 올렸습니다.'
    : '선체가 더는 버티지 못합니다.<br>배는 모래톱에 <b>얹혔습니다.</b>';
  const box = document.getElementById('reviewBox');
  box.innerHTML = '<h3>다시 볼 말</h3>' + (missed.length
    ? '<ul>' + missed.map(m => '<li><b>' + m.a + '</b> · ' + m.why + '</li>').join('') + '</ul>'
    : '<li>모든 수로를 바르게 골랐습니다</li>');
  document.getElementById('endScreen').classList.remove('hidden');
}

/* ── 진행 ────────────────────────────────── */

/* ── 전체 걸린 시간 ─────────────────────── */
let elapsed = 0;
function fmt(sec){
  const m = Math.floor(sec/60), ss = Math.floor(sec%60);
  return m + ':' + String(ss).padStart(2,'0');
}
function tickClock(dt){
  elapsed += dt;
  const el = document.getElementById('clockN');
  if(el) el.textContent = fmt(elapsed);
  const hand = document.getElementById('hand');
  if(hand){
    const a = (elapsed % 60) / 60 * Math.PI*2;
    hand.setAttribute('x2', (13 + Math.sin(a)*6).toFixed(2));
    hand.setAttribute('y2', (14 - Math.cos(a)*6).toFixed(2));
  }
}
function resetClock(){
  elapsed = 0;
  const el = document.getElementById('clockN');
  if(el) el.textContent = '0:00';
}

function step(dt){
  tickClock(dt);
  t += dt;
  if(shake > 0) shake -= dt;
  if(groundT > 0) groundT -= dt;
  if(toastT > 0){ toastT -= dt; if(toastT <= 0) toast = null; }

  const rud = (keys.up ? -1 : 0) + (keys.down ? 1 : 0);
  head += rud * 1.75 * dt;
  head -= head * (rud === 0 ? 2.6 : 0.5) * dt;
  head = Math.max(-0.5, Math.min(0.5, head));

  speed += (195 - speed) * 1.3 * dt;
  dist += speed * dt;
  off  += Math.sin(head) * speed * dt;

  const rel = off - centerline(dist);

  // 기슭
  const hwNow = hwAt(dist);
  if(Math.abs(rel) > hwNow - 14){
    off = centerline(dist) + Math.sign(rel) * (hwNow - 16);
    head *= -0.3;
    if(groundT <= 0) hurt('기슭에 얹혔습니다');
  }

  fx.forEach(f => {
    f.a -= dt * (f.text ? 1.1 : (f.ring ? 1.6 : 1.5));
    if(f.vd) f.d += f.vd*dt;
    if(f.voff) f.off += f.voff*dt;
    if(f.ring) f.r += dt*90;
    if(f.vd) f.vd *= (1 - dt*2.2);
    if(f.voff && !f.text) f.voff *= (1 - dt*2.2);
  });
  fx = fx.filter(f => f.a > 0);

  course.forEach(o => { if(o.fadeT > 0) o.fadeT -= dt; });

  if(Math.random() < dt*26) wake.push({ d:dist, off:off + rnd(-8,8), a:.55, r:rnd(2,5) });
  wake.forEach(w => { w.a -= dt*0.5; w.r += dt*7; });
  wake = wake.filter(w => w.a > 0 && dist - w.d < 140);

  course.forEach(o => {
    if(o.done) return;

    if(o.type === 'fork'){
      if(dist > o.d - o.span*0.5 && dist < o.d + o.span*0.5){
        [-ISL, ISL].forEach(ix => {
          if(Math.abs(rel - ix*AMP) < 24 && groundT <= 0) hurt('모래섬에 얹혔습니다');
        });
      }
      // 표지판이 선 자리를 지나는 순간이 곧 선택이다
      if(dist >= o.d - o.span*0.5 - 34){
        o.done = true; qi++;
        // 가장 가까운 표지를 고른 것으로 본다
        let bucket = 1, bd = 1e9;
        for(let i=0;i<3;i++){
          const laneOff = (i-1) * (ISL + 40) * AMP;
          const d2 = Math.abs(rel - laneOff);
          if(d2 < bd){ bd = d2; bucket = i; }
        }
        o.pick = bucket;
        o.fadeT = 0.85;
        const chosen = o.opts[bucket];
        const laneOff = (bucket-1) * (ISL + 40) * AMP;
        const okPick = o.opts[bucket] && o.opts[bucket].ok;
        burst(o.d - o.span*0.5 - 34, centerline(o.d) + laneOff,
              okPick ? '120,210,160' : '232,140,132', 20, 230);
        ring(o.d - o.span*0.5 - 34, centerline(o.d) + laneOff,
             okPick ? '120,210,160' : '232,140,132');
        floatText(o.d - o.span*0.5 - 34, centerline(o.d) + laneOff,
                  okPick ? '정답' : o.opts.find(x=>x.ok).text,
                  okPick ? '120,210,160' : '232,140,132');
        attempts.push({
          idiom_id: o.item.id, game: 'suez', format: 'gate3',
          is_correct: !!okPick, ms: Math.round(performance.now() - questionShownAt)
        });
        if(chosen && chosen.ok){ score++; toastMsg('바른 수로입니다', false); }
        else {
          if(!missed.includes(o.item)) missed.push(o.item);
          hurt('정답은 ' + o.item.a);
        }
        updateHud();
        const nx = course.find(c => c.type === 'fork' && !c.done);
        setQuestion(nx ? nx.item : null);
      }
      return;
    }

    if(o.type === 'goal'){
      if(dist >= o.d){ o.done = true; end(true); }
      return;
    }

    if(o.type === 'rescue'){
      const ro = o.off + Math.sin(t*1.4 + o.ph) * 10 * AMP;
      if(Math.abs(o.d - dist) < 30 && Math.abs(rel - ro) < 34){
        o.done = true; o.fadeT = 0.45; saved++;
        burst(o.d, centerline(o.d) + ro, '255,224,138', 16, 190);
        ring(o.d, centerline(o.d) + ro, '246,236,214');
        floatText(o.d, centerline(o.d) + ro, '구조 +1', '255,224,138');
        if(saved % 3 === 0 && stam < 3){
          stam++;
          toastMsg('조난자 셋을 구했습니다 · 선체 수리', false);
        } else {
          toastMsg('조난자를 건져 올렸습니다', false);
        }
        updateHud();
      }
      return;
    }

    // 장애물 — 구간 안에 있는 동안 계속 살핀다
    const dz0 = o.d - dist;
    if(Math.abs(dz0) > (o.len || 40)/2 + 20) return;
    if(groundT > 0) return;

    if(o.kind === 'buoys'){
      if(o.line.some(ly => Math.abs(rel - ly) < 26)){
        o.done = true; hurt('부표에 부딪혔습니다');
      }
    } else if(o.kind === 'barge'){
      const blocked = o.side < 0 ? rel < o.inner : rel > o.inner;
      if(blocked){ o.done = true; hurt('준설선에 부딪혔습니다'); }
    } else if(o.kind === 'felucca'){
      const fo = o.base + Math.sin(t*1.1 + o.ph) * o.amp * AMP;
      if(Math.abs(rel - fo) < 30){ o.done = true; hurt('돛단배와 부딪혔습니다'); }
    }
  });
}

/* ════════════════════════════════════════════
   그리기 — dz(앞으로의 거리)는 오른쪽, off(치우침)는 아래쪽
   ════════════════════════════════════════════ */
const xOf = dz => SHIPX + dz;
const yOf = (worldOff, dz) => MID + (worldOff - centerline(dist + dz));

function render(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#c8a973');
  g.addColorStop(.5, '#d3b681');
  g.addColorStop(1, '#c19c66');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 모래 결 — 왼쪽으로 흐른다
  ctx.strokeStyle = 'rgba(140,110,66,.20)'; ctx.lineWidth = 1.4;
  for(let k=0;k<8;k++){
    const xx = ((k*170 - dist*0.4) % (W+220) + W+220) % (W+220) - 110;
    ctx.beginPath();
    for(let y=0;y<=H;y+=24) ctx.lineTo(xx + Math.sin(y*0.014 + k)*15, y);
    ctx.stroke();
  }

  // 수로 — 화면 왼쪽 밖에서 오른쪽 밖까지 끊김 없이
  const D0 = -SHIPX - 120, D1 = AHEAD, STEP = 10;
  const edge = [];
  for(let dz=D0; dz<D1; dz+=STEP) edge.push(dz);
  edge.push(D1);

  ctx.fillStyle = '#3f7f86';
  ctx.beginPath();
  edge.forEach(dz => ctx.lineTo(xOf(dz), yOf(centerline(dist+dz) - hwAt(dist+dz), dz)));
  for(let i=edge.length-1; i>=0; i--){
    const dz = edge[i];
    ctx.lineTo(xOf(dz), yOf(centerline(dist+dz) + hwAt(dist+dz), dz));
  }
  ctx.closePath(); ctx.fill();

  // 물결
  const SPANZ = D1 - D0;
  ctx.strokeStyle = 'rgba(190,230,232,.15)'; ctx.lineWidth = 1.6;
  for(let k=0;k<10;k++){
    const dz = ((k*130 - dist*0.7) % SPANZ + SPANZ) % SPANZ + D0;
    ctx.beginPath();
    ctx.moveTo(xOf(dz), yOf(centerline(dist+dz) - HW + 14, dz));
    ctx.lineTo(xOf(dz), yOf(centerline(dist+dz) + HW - 14, dz));
    ctx.stroke();
  }

  // 기슭
  ctx.strokeStyle = 'rgba(120,92,50,.55)'; ctx.lineWidth = 3;
  [-1,1].forEach(sd => {
    ctx.beginPath();
    edge.forEach(dz => ctx.lineTo(xOf(dz), yOf(centerline(dist+dz) + sd*hwAt(dist+dz), dz)));
    ctx.stroke();
  });

  // 물살 자국
  wake.forEach(w => {
    const dz = w.d - dist;
    ctx.fillStyle = 'rgba(225,245,246,' + w.a + ')';
    ctx.beginPath(); ctx.arc(xOf(dz), yOf(w.off, dz), w.r, 0, Math.PI*2); ctx.fill();
  });

  // 코스
  course.forEach(o => {
    const dz = o.d - dist;

    if(o.type === 'fork'){
      if(dz > AHEAD + 60 || dz < -o.span - 120) return;
      [-ISL, ISL].forEach(ix => {
        ctx.fillStyle = '#c6a877';
        ctx.beginPath();
        for(let s=-o.span/2; s<=o.span/2; s+=14){
          const z2 = dz + s, wdt = 20 * Math.cos(s/o.span*Math.PI);
          ctx.lineTo(xOf(z2), yOf(centerline(dist+z2) + ix*AMP - wdt, z2));
        }
        for(let s=o.span/2; s>=-o.span/2; s-=14){
          const z2 = dz + s, wdt = 20 * Math.cos(s/o.span*Math.PI);
          ctx.lineTo(xOf(z2), yOf(centerline(dist+z2) + ix*AMP + wdt, z2));
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(120,92,50,.5)'; ctx.lineWidth = 1.6; ctx.stroke();
      });

      // 표지판 — 갈림목 어귀에 미리 선다. 이 선을 지나는 순간이 선택이다
      const zs = dz - o.span*0.5 - 34;
      if(zs < AHEAD + 220 && zs > -60 && (!o.done || o.fadeT > 0)){
        const sf = o.done ? Math.max(0, o.fadeT/0.85) : 1;
        ctx.save();
        ctx.globalAlpha = o.done ? sf : 1;
        if(!o.done){
          ctx.strokeStyle = 'rgba(201,162,39,.45)';
          ctx.lineWidth = 2; ctx.setLineDash([7,7]);
          ctx.beginPath();
          ctx.moveTo(xOf(zs), yOf(centerline(dist+zs) - HW, zs));
          ctx.lineTo(xOf(zs), yOf(centerline(dist+zs) + HW, zs));
          ctx.stroke();
          ctx.setLineDash([]);
        }
        o.opts.forEach((op, i) => {
          const laneOff = (i-1) * (ISL + 40) * AMP;
          const x = xOf(zs), y = yOf(centerline(dist+zs) + laneOff, zs);
          const grow = (o.done && o.pick === i) ? 1 + (1-sf)*0.4 : 1;
          ctx.save();
          ctx.translate(x, y); ctx.scale(grow, grow); ctx.translate(-x, -y);
          ctx.font = '700 16px "Noto Serif KR", serif';
          const bw = ctx.measureText(op.text).width + 22;
          ctx.fillStyle = 'rgba(0,0,0,.22)';
          ctx.fillRect(x - bw/2 + 3, y - 12, bw, 28);
          ctx.fillStyle = '#f6ecd6';
          ctx.fillRect(x - bw/2, y - 15, bw, 28);
          const picked = o.done && o.pick === i;
          ctx.strokeStyle = picked ? (op.ok ? '#2f6b4f' : '#a8322d') : '#a8801f';
          ctx.lineWidth = picked ? 3.5 : 2;
          ctx.strokeRect(x - bw/2, y - 15, bw, 28);
          ctx.fillStyle = '#3a2c1c';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(op.text, x, y);
          ctx.restore();
        });
        ctx.restore();
      }
      return;
    }

    if(o.type === 'goal'){
      if(dz > AHEAD || dz < -SHIPX - 40) return;
      ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(xOf(dz), yOf(centerline(dist+dz) - HW, dz));
      ctx.lineTo(xOf(dz), yOf(centerline(dist+dz) + HW, dz));
      ctx.stroke();
      ctx.save();
      ctx.translate(xOf(dz) - 14, yOf(centerline(dist+dz), dz));
      ctx.rotate(-Math.PI/2);
      ctx.font = '900 20px "Noto Serif KR", serif';
      ctx.fillStyle = '#f6ecd6'; ctx.textAlign = 'center';
      ctx.fillText('수 에 즈', 0, 0);
      ctx.restore();
      return;
    }

    if(dz > AHEAD || dz < -SHIPX - 120) return;
    const x = xOf(dz), cy = centerline(dist+dz);

    if(o.type === 'rescue'){
      if(o.done && !(o.fadeT > 0)) return;
      const fade = o.done ? Math.max(0, o.fadeT/0.45) : 1;
      const ro = o.off + Math.sin(t*1.4 + o.ph) * 10 * AMP;
      const y = yOf(cy + ro, dz);
      const bob = Math.sin(t*2.6 + o.ph) * 2;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(x, y);
      ctx.scale(1 + (1-fade)*0.7, 1 + (1-fade)*0.7);
      ctx.translate(-x, -y);
      // 물결
      ctx.strokeStyle = 'rgba(246,236,214,.28)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(x, y + bob, 24 + Math.sin(t*2.2 + o.ph)*3, 0, Math.PI*2); ctx.stroke();
      // 튜브
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#e07a35';
      ctx.beginPath(); ctx.arc(x, y + bob, 12, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#f6ecd6'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(x, y + bob, 12, -0.5, 0.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y + bob, 12, Math.PI-0.5, Math.PI+0.5); ctx.stroke();
      // 사람
      ctx.fillStyle = '#e9c9a4';
      ctx.beginPath(); ctx.arc(x, y + bob - 1, 5.4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4a3a28';
      ctx.beginPath(); ctx.arc(x, y + bob - 4, 5.4, Math.PI, Math.PI*2); ctx.fill();
      // 흔드는 팔
      ctx.strokeStyle = '#e9c9a4'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 4, y + bob);
      ctx.lineTo(x + 12, y + bob - 10 + Math.sin(t*9 + o.ph)*4);
      ctx.stroke();
      ctx.restore();
      return;
    }

    if(o.kind === 'buoys'){
      o.line.forEach(ly => {
        const y = yOf(cy + ly, dz);
        ctx.fillStyle = '#a8322d';
        ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f6ecd6';
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(246,236,214,.3)'; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(x, y, 16 + Math.sin(t*3 + ly)*2, 0, Math.PI*2); ctx.stroke();
      });
      // 트인 자리에 초록 표시
      ctx.strokeStyle = 'rgba(90,190,130,.55)'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(x - 9, yOf(cy + o.gap, dz)); ctx.lineTo(x + 9, yOf(cy + o.gap, dz));
      ctx.stroke();

    } else if(o.kind === 'barge'){
      const x1 = xOf(dz - o.len/2), x2 = xOf(dz + o.len/2);
      const yIn = yOf(cy + o.inner, dz);
      const yOut = yOf(cy + o.side * hwAt(o.d) , dz);
      ctx.fillStyle = '#4a4036';
      ctx.fillRect(Math.min(x1,x2), Math.min(yIn,yOut), Math.abs(x2-x1), Math.abs(yOut-yIn));
      ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2;
      ctx.strokeRect(Math.min(x1,x2), Math.min(yIn,yOut), Math.abs(x2-x1), Math.abs(yOut-yIn));
      // 노란 빗금
      ctx.fillStyle = 'rgba(201,162,39,.35)';
      for(let i=0;i<5;i++) ctx.fillRect(Math.min(x1,x2) + 14 + i*32, Math.min(yIn,yOut) + 6, 9, Math.abs(yOut-yIn) - 12);
      // 기중기
      ctx.fillStyle = '#2b241d';
      ctx.fillRect((x1+x2)/2 - 4, yIn - o.side*4, 8, o.side*26);

    } else if(o.kind === 'felucca'){
      const fo = o.base + Math.sin(t*1.1 + o.ph) * o.amp * AMP;
      const y = yOf(cy + fo, dz);
      ctx.fillStyle = '#4a3a28';
      ctx.beginPath();
      ctx.moveTo(x + 20, y); ctx.lineTo(x - 16, y + 8);
      ctx.lineTo(x - 16, y - 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#efe4cc';
      ctx.beginPath();
      ctx.moveTo(x - 2, y - 4); ctx.lineTo(x - 2, y - 30); ctx.lineTo(x + 18, y - 6);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(246,236,214,.3)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.stroke();
    }
  });

  // 사라지는 효과
  fx.forEach(f => {
    const dz = f.d - dist;
    if(dz > AHEAD || dz < -SHIPX - 120) return;
    const x = xOf(dz), y = yOf(f.off, dz);
    if(f.text){
      ctx.font = '700 15px "Noto Serif KR", serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(20,15,9,' + (f.a*.5) + ')';
      ctx.fillText(f.text, x + 1, y + 1);
      ctx.fillStyle = 'rgba(' + f.c + ',' + f.a + ')';
      ctx.fillText(f.text, x, y);
    } else if(f.ring){
      ctx.strokeStyle = 'rgba(' + f.c + ',' + (f.a*.8) + ')';
      ctx.lineWidth = 3 * f.a;
      ctx.beginPath(); ctx.arc(x, y, f.r, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(' + f.c + ',' + f.a + ')';
      ctx.beginPath(); ctx.arc(x, y, f.r * f.a, 0, Math.PI*2); ctx.fill();
    }
  });

  drawShip();

  if(toast){
    const a = Math.min(1, toastT*1.6);
    ctx.font = '500 15px "Noto Sans KR", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(toast.text).width + 30;
    ctx.fillStyle = 'rgba(20,15,9,' + (a*.82) + ')';
    ctx.fillRect(W/2 - tw/2, 16, tw, 30);
    ctx.fillStyle = toast.bad ? 'rgba(244,196,190,' + a + ')' : 'rgba(255,224,138,' + a + ')';
    ctx.fillText(toast.text, W/2, 31);
  }
}

function drawShip(){
  const x = SHIPX, y = yOf(off, 0) + (shake > 0 ? Math.sin(t*60)*3 : 0);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(head*0.85);          // 뱃머리는 오른쪽

  ctx.fillStyle = '#2f3a44';
  ctx.beginPath();
  ctx.moveTo(46, 0);
  ctx.quadraticCurveTo(22, 19, -22, 17);
  ctx.lineTo(-22, -17);
  ctx.quadraticCurveTo(22, -19, 46, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(201,162,39,.6)'; ctx.lineWidth = 1.6; ctx.stroke();

  ctx.fillStyle = '#7d5f42';
  ctx.beginPath();
  ctx.moveTo(34, 0);
  ctx.quadraticCurveTo(16, 13, -15, 12);
  ctx.lineTo(-15, -12);
  ctx.quadraticCurveTo(16, -13, 34, 0);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#20272e';
  ctx.fillRect(-8, -9, 14, 18);
  ctx.fillStyle = '#c9a227';
  ctx.fillRect(-8, -9, 2.5, 18);
  ctx.fillStyle = '#3a2c1c';
  ctx.beginPath(); ctx.arc(16, 0, 5.5, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = 'rgba(201,162,39,.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-22, 0); ctx.lineTo(-31, Math.sin(head)*13);
  ctx.stroke();
  ctx.restore();

  // 연기 — 왼쪽으로 흘러간다
  ctx.fillStyle = 'rgba(60,50,40,.15)';
  for(let k=0;k<4;k++){
    const p = (t*0.6 + k*0.25) % 1;
    ctx.beginPath();
    ctx.arc(x - p*80, y + Math.sin(k)*8 - p*10, 7 + p*15, 0, Math.PI*2);
    ctx.fill();
  }
}

/* ── 루프 ────────────────────────────────── */
function loop(ts){
  if(!playing) return;
  const dt = Math.min((ts-lastTs)/1000, .05);
  lastTs = ts;
  step(dt);
  render();
  rafId = requestAnimationFrame(loop);
}

/* ── 입력 ────────────────────────────────── */
const MAP = { ArrowUp:'up', ArrowDown:'down', w:'up', s:'down' };
window.addEventListener('keydown', e => {
  if(!playing){
    if(e.code === 'Space' && !document.getElementById('endScreen').classList.contains('hidden')) startGame();
    return;
  }
  const k = MAP[e.key];
  if(k){ e.preventDefault(); keys[k] = true; }
});
window.addEventListener('keyup', e => { const k = MAP[e.key]; if(k) keys[k] = false; });

let touching = false;
function touch(e){
  if(!playing) return;
  const r = stage.getBoundingClientRect();
  const y = e.clientY - r.top;
  const shipY = yOf(off, 0);
  keys.up   = y < shipY - 16;
  keys.down = y > shipY + 16;
}
stage.addEventListener('pointerdown', e => { touching = true; touch(e); });
stage.addEventListener('pointermove', e => { if(touching) touch(e); });
window.addEventListener('pointerup', () => { touching = false; keys.up = keys.down = false; });

/* ── 시작 ────────────────────────────────── */
async function startGame(){
  document.getElementById('start').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('loadError').classList.add('hidden');
  document.getElementById('loading').classList.remove('hidden');
  try {
    await loadItems();
  } catch(err){
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('loadErrorMsg').textContent = (err && err.message) || '문항을 가져오지 못했습니다';
    document.getElementById('loadError').classList.remove('hidden');
    return;
  }
  document.getElementById('loading').classList.add('hidden');

  resetClock();
  resize();
  buildCourse();
  dist = 0; speed = 195; off = centerline(0); head = 0;
  stam = 3; score = 0; saved = 0; qi = 0; missed = []; wake = []; toast = null;
  shake = 0; groundT = 0; t = 0; fx = []; attempts = [];
  const first = course.find(c => c.type === 'fork');
  setQuestion(first ? first.item : null);
  updateHud();
  playing = true; lastTs = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
buildCourse(); off = centerline(0); render();
</script>
