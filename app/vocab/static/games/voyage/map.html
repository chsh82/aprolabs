<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>80일간의 어휘 일주</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe4cc; --paper-2:#e5d7b9;
    --land:#ded0ac; --land-line:rgba(30,50,71,.34);
    --ink:#1e3247; --ink-2:#4a627a;
    --geum:#a8801f; --injoo:#a8322d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#16202b;color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .frame{
    width:min(940px,100%);height:min(680px,100vh - 32px);
    background:radial-gradient(760px 460px at 35% 25%, #f5ecd8 0%, var(--paper) 58%, var(--paper-2) 100%);
    border:1px solid rgba(30,50,71,.35);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }

  .clock{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-right:16px;
         border-right:1px solid rgba(30,50,71,.28)}
  .clock svg{display:block}
  .clock b{font-family:"Noto Serif KR",serif;font-weight:900;font-size:20px;
           line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .clock em{font-style:normal;font-size:10.5px;color:var(--ink-2);display:block;margin-top:2px;letter-spacing:.08em}
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 20px;border-bottom:1px solid rgba(30,50,71,.28);flex:0 0 auto;
  }
  .days{display:flex;align-items:baseline;gap:7px}
  .days b{font-family:"Noto Serif KR",serif;font-weight:900;font-size:29px;line-height:1;font-variant-numeric:tabular-nums}
  .days span{font-size:12.5px;color:var(--ink-2)}
  .days.tight b{color:var(--injoo)}
  .leg{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.5}
  .leg b{display:block;font-family:"Noto Serif KR",serif;font-size:15px;color:var(--ink);font-weight:600}

  .body{flex:1 1 auto;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
  .view.hidden{display:none}

  .mapwrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 10px}
  svg.map{width:100%;height:100%}
  .lbl{font-family:"Noto Serif KR",serif;font-size:12px;fill:var(--ink);paint-order:stroke;
       stroke:rgba(245,236,216,.9);stroke-width:3px;stroke-linejoin:round}
  .lbl.dim{fill:rgba(30,50,71,.45)}

  .mapfoot{flex:0 0 auto;padding:12px 24px 18px;text-align:center;border-top:1px solid rgba(30,50,71,.16)}
  .mapfoot p{font-family:"Noto Serif KR",serif;font-size:15px;line-height:1.65;max-width:56ch;margin:0 auto 13px;color:var(--ink-2)}
  .mapfoot p b{color:var(--ink);font-weight:600}

  button{font-family:inherit;cursor:pointer}
  .go{font-size:15px;padding:12px 38px;background:transparent;color:var(--ink);
      border:1.5px solid var(--ink);letter-spacing:.06em;transition:background .15s,color .15s}
  .go:hover,.go:focus-visible{background:var(--ink);color:var(--paper)}
  .go:disabled{opacity:.35;cursor:default}
  button:focus-visible{outline:2px solid var(--geum);outline-offset:2px}

  .qhead{flex:0 0 auto;display:flex;align-items:center;gap:14px;
         padding:13px 24px 11px;border-bottom:1px solid rgba(30,50,71,.16)}
  .qhead .meta{font-size:12px;color:var(--ink-2);line-height:1.5}
  .qhead .meta b{display:block;font-family:"Noto Serif KR",serif;font-size:15.5px;color:var(--ink);font-weight:600}

  .framewrap{flex:1 1 auto;min-height:0;position:relative;background:#0e0c0a}
  #stageFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

  .end{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:32px 26px;gap:11px}
  .end .big{font-family:"Noto Serif KR",serif;font-weight:900;font-size:42px;line-height:1.1}
  .end .sub{font-family:"Noto Serif KR",serif;font-size:17.5px;line-height:1.7;max-width:46ch;color:var(--ink-2)}
  .end .sub b{color:var(--ink);font-weight:600}
  .end .tally{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.8}

  @media (max-width:640px){
    .days b{font-size:24px}
    .end .big{font-size:32px}
    .mapfoot p{font-size:13.5px}
  }
</style>
</head>
<body>

<div class="frame">
  <div class="top">
    <div class="clock">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="14" r="9.4" fill="none" stroke="#a8801f" stroke-width="1.6"/>
        <rect x="11" y="1.6" width="4" height="3.4" fill="#a8801f"/>
        <rect x="12.2" y="4.4" width="1.6" height="1.8" fill="#a8801f"/>
        <line id="hand" x1="13" y1="14" x2="13" y2="8" stroke="#1e3247" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="13" cy="14" r="1.2" fill="#1e3247"/>
      </svg>
      <div><b id="clockN">0:00</b><em>걸린 시간</em></div>
    </div>
    <div class="days" id="daysBox"><b id="daysLeft">80</b><span>일 남음</span></div>
    <div class="leg" id="legInfo"><b>런던</b>리폼 클럽</div>
  </div>

  <div class="body">
    <div class="view" id="vMap">
      <div class="mapwrap"><svg class="map" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" id="mapSvg"></svg></div>
      <div class="mapfoot">
        <p id="mapText"></p>
        <button class="go" id="mapBtn">출발</button>
      </div>
    </div>

    <div class="view hidden" id="vQuiz">
      <div class="qhead">
        <div class="meta"><b id="qPlace"></b><span id="qKind"></span></div>
      </div>
      <div class="framewrap">
        <iframe id="stageFrame" title="구간"></iframe>
      </div>
    </div>

    <div class="view hidden" id="vEnd">
      <div class="end">
        <div class="big" id="endBig"></div>
        <div class="sub" id="endSub"></div>
        <div class="tally" id="endTally"></div>
        <button class="go" id="endBtn" style="margin-top:16px">이튿날 아침</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   지도 — 위도·경도를 그대로 투영
   x = (lon+180)/360*800,  y = (75-lat)/130*400
   ════════════════════════════════════════════ */
const proj = (lat, lon) => ({ x:(lon+180)/360*800, y:(75-lat)/130*400 });

const NODES = [
  {name:"런던",     ...proj(51.5,  -0.1)},
  {name:"수에즈",   ...proj(30.0,  32.5)},
  {name:"봄베이",   ...proj(19.0,  72.8)},
  {name:"홍콩",     ...proj(22.3, 114.2)},
  {name:"요코하마", ...proj(35.4, 139.6)},
  {name:"뉴욕",     ...proj(40.7, -74.0)},
  {name:"런던",     ...proj(51.5,  -0.1)}
];

/* 태평양 구간은 지도 오른쪽 끝으로 나가 왼쪽 끝에서 들어온다 */
function legSegs(i){
  const a = NODES[i], b = NODES[i+1];
  if(i === 4){
    return [
      { a, c:{x:762, y:a.y-24}, b:{x:800, y:112} },
      { a:{x:0, y:112}, c:{x:112, y:92}, b }
    ];
  }
  const lift = i === 5 ? 32 : 24;
  return [{ a, c:{x:(a.x+b.x)/2, y:Math.min(a.y,b.y)-lift}, b }];
}
const qpt = (s,t) => ({
  x:(1-t)*(1-t)*s.a.x + 2*(1-t)*t*s.c.x + t*t*s.b.x,
  y:(1-t)*(1-t)*s.a.y + 2*(1-t)*t*s.c.y + t*t*s.b.y
});
const segPath = s => `M${s.a.x},${s.a.y} Q${s.c.x},${s.c.y} ${s.b.x},${s.b.y}`;

/* 대륙 약식 윤곽 (투영 좌표계) */
const LAND = [
  "M28,58 L62,36 L112,28 L178,26 L236,38 L263,62 L250,86 L263,104 L246,120 L251,146 L234,170 L241,196 L228,180 L212,152 L194,132 L158,120 L118,112 L84,92 L56,78 L34,70 Z",
  "M238,198 L274,206 L302,224 L313,256 L300,302 L282,342 L268,388 L252,360 L246,316 L232,268 L227,230 Z",
  "M300,20 L346,14 L364,30 L340,48 L306,42 Z",
  "M376,60 L412,40 L450,34 L484,44 L493,62 L470,84 L448,96 L420,104 L398,96 L382,80 Z",
  "M368,152 L402,132 L450,126 L494,133 L509,151 L500,183 L482,207 L470,241 L452,279 L430,319 L410,297 L400,258 L382,221 Z",
  "M482,38 L562,22 L642,26 L708,40 L737,62 L724,92 L700,110 L717,128 L690,150 L660,168 L637,186 L606,178 L580,160 L548,140 L516,118 L492,92 L480,66 Z",
  "M556,142 L574,144 L566,180 L550,158 Z",
  "M640,196 L672,190 L690,204 L676,224 L648,220 Z",
  "M656,284 L700,272 L733,283 L739,309 L716,331 L684,333 L660,313 Z"
];

/* ════════════════════════════════════════════
   여정 설정 — URL 쿼리스트링에서 받는다(사용자 결정, 2026-09-03). 없으면 기본값.
   각 구간 iframe에 그대로 넘긴다 - 구간 파일들은 이미 이 두 파라미터를
   자기 URL에서 읽도록 만들어져 있다(?level=, ?student_id=).
   ════════════════════════════════════════════ */
const LEVEL = new URLSearchParams(location.search).get('level') || 7;
const STUDENT_ID = new URLSearchParams(location.search).get('student_id') || 'test_01';

/* ════════════════════════════════════════════
   여정 — 6구간. STAGES 순서가 곧 지도의 진행 순서다.
   file이 있는 구간은 그 파일을 iframe으로 띄운다(HANDOFF.md 4절).
   ready:false인 구간(pacific/train)은 아직 문항 콘텐츠가 없어(docs/vocab/MISSING.md)
   지도에서 "준비 중"으로 표시하고 자동으로 통과시킨다 - 나중에 콘텐츠가
   들어오면 이 값만 true로 바꾸면 된다.
   ════════════════════════════════════════════ */
const STAGES = [
  { place:"수에즈", file:"suez.html", ready:true, transport:"증기선", days:12,
    kind:"배경지식 어휘 · 땅과 바다",
    intro:"포그는 리폼 클럽의 신사들과 <b>이만 파운드</b>를 걸었습니다. 팔십 일 안에 세계를 돌아 이 자리로 돌아오겠다고요. 첫 항로는 지중해를 지나 <b>수에즈</b>로 향합니다." },

  { place:"인도", file:"elephant.html", ready:true, transport:"코끼리와 열차", days:14,
    kind:"속담과 성어 · 바르게 쓰였는가",
    intro:"인도에 닿았으나 철도가 <b>끊겨 있습니다</b>. 포그는 코끼리를 사서 정글을 가로지르기로 합니다. 길 위에서 만난 말들이 제자리에 쓰였는지 가려내야 합니다." },

  { place:"홍콩", file:"hongkong.html", ready:true, transport:"증기선", days:13,
    kind:"속임수와 판단 · 글자를 맞춰라",
    intro:"홍콩에서 파스파르투가 <b>속임수에 걸려</b> 배를 놓칠 뻔합니다. 흩어진 글자를 순서대로 맞춰 말을 되살리세요." },

  { place:"태평양", file:"pacific.html", ready:false, transport:"태평양 횡단 증기선", days:11,
    kind:"교과학습 어휘 · 공부에 쓰는 말",
    intro:"요코하마를 떠나 태평양을 건넙니다. 이 구간은 아직 문항이 준비되지 않아 자동으로 지나갑니다." },

  { place:"미국", file:"train.html", ready:false, transport:"대륙 횡단 열차", days:11,
    kind:"문맥 속의 낱말 · 대륙을 가로지르며",
    intro:"샌프란시스코에서 대륙 횡단 열차에 오릅니다. 이 구간은 아직 문항이 준비되지 않아 자동으로 지나갑니다." },

  { place:"대서양", file:"furnace.html", ready:true, transport:"증기선", days:8,
    kind:"마지막 항해 · 놓친 것을 다시",
    intro:"석탄이 떨어져 <b>배의 목재를 뜯어 태웁니다</b>. 남은 것은 앞에서 놓친 말들뿐입니다. 이것만 되찾으면 런던입니다." }
];

/* ── 전체 걸린 시간 ─────────────────────── */
let elapsed = 0, clockT = null;
function fmt(sec){
  const m = Math.floor(sec/60), ss = Math.floor(sec%60);
  return m + ':' + String(ss).padStart(2,'0');
}
function paintClock(){
  const el = document.getElementById('clockN');
  if(el) el.textContent = fmt(elapsed);
  const hand = document.getElementById('hand');
  if(hand){
    const a = (elapsed % 60) / 60 * Math.PI*2;
    hand.setAttribute('x2', (13 + Math.sin(a)*6).toFixed(2));
    hand.setAttribute('y2', (14 - Math.cos(a)*6).toFixed(2));
  }
}
function startClock(){
  stopClock(); elapsed = 0; paintClock();
  clockT = setInterval(() => { elapsed += 0.25; paintClock(); }, 250);
}
function stopClock(){ if(clockT){ clearInterval(clockT); clockT = null; } }

/* ════════════════════════════════════════════
   상태
   ════════════════════════════════════════════ */
let used = 0, stageIdx = 0, wrongCount = 0;
let missedIds = [];   // 여정 전체에서 놓친 idiom_id 누적 - 화로 구간 보너스 여부 판단(HANDOFF.md 4절)

/* 회차 — 지금은 저장할 데(학생 계정)가 없어 메모리에만 둔다. 페이지를
   새로고침하면 1회차로 돌아간다. 나중에 로그인/학생 계정이 붙으면
   여기서 서버에 회차를 저장·조회하도록 바꿀 것 (TODO). */
let round = 1;

const $ = id => document.getElementById(id);

const daysLeft = () => 80 - used;
function updateTop(){
  $('daysLeft').textContent = Math.max(0, daysLeft());
  $('daysBox').classList.toggle('tight', daysLeft() <= 12);
}

/* ── 지도 ────────────────────────────────── */
let marker = null;

function drawMap(){
  let s = '';
  s += `<rect width="800" height="400" fill="#dde5e2" opacity=".6"/>`;
  for(let y=42;y<400;y+=52) s += `<line x1="0" y1="${y}" x2="800" y2="${y}" stroke="rgba(30,50,71,.08)"/>`;
  for(let x=50;x<800;x+=50) s += `<line x1="${x}" y1="0" x2="${x}" y2="400" stroke="rgba(30,50,71,.08)"/>`;
  s += `<line x1="0" y1="230.8" x2="800" y2="230.8" stroke="rgba(30,50,71,.22)" stroke-dasharray="7 6"/>`;

  LAND.forEach(d => {
    s += `<path d="${d}" fill="var(--land)" stroke="var(--land-line)" stroke-width="1" stroke-linejoin="round"/>`;
  });

  s += `<g transform="translate(56,346)" opacity=".38">
          <circle r="19" fill="none" stroke="#1e3247"/>
          <path d="M0,-16 L4.5,0 L0,16 L-4.5,0 Z" fill="#1e3247"/>
          <text y="-23" text-anchor="middle" font-size="10" fill="#1e3247">N</text>
        </g>`;

  for(let i=0;i<NODES.length-1;i++){
    const done = i < stageIdx;
    legSegs(i).forEach(sg => {
      s += `<path d="${segPath(sg)}" fill="none"
              stroke="${done ? '#a8801f' : 'rgba(30,50,71,.34)'}"
              stroke-width="${done ? 2.4 : 1.4}" stroke-dasharray="${done ? '' : '5 5'}"/>`;
    });
  }

  NODES.forEach((n,i) => {
    if(i === 6) return;
    const passed = i <= stageIdx;
    s += `<circle cx="${n.x}" cy="${n.y}" r="${i === stageIdx ? 6 : 4}"
            fill="${passed ? '#a8801f' : 'rgba(30,50,71,.3)'}"/>`;
    s += `<text class="lbl ${passed ? '' : 'dim'}" x="${n.x}" y="${n.y - 12}" text-anchor="middle">${n.name}</text>`;
  });

  const at = NODES[Math.min(stageIdx, 6)];
  s += `<g id="fogg" transform="translate(${at.x},${at.y})">
          <ellipse cx="0" cy="4" rx="10" ry="3.4" fill="rgba(30,50,71,.18)"/>
          <path d="M-4,2 L4,2 L3,-9 L-3,-9 Z" fill="#1e3247"/>
          <circle cx="0" cy="-12" r="3.2" fill="#e9dcc2"/>
          <rect x="-5.4" y="-19" width="10.8" height="2.2" fill="#1e3247"/>
          <rect x="-3.4" y="-25" width="6.8" height="6.4" fill="#1e3247"/>
          <rect x="-3.4" y="-21.6" width="6.8" height="1.4" fill="#a8801f"/>
          <line x1="5" y1="-6" x2="7.5" y2="3" stroke="#a8801f" stroke-width="1.4" stroke-linecap="round"/>
        </g>`;

  $('mapSvg').innerHTML = s;
  marker = $('fogg');
}

function travel(i){
  const segs = legSegs(i);
  const dur = 1600, t0 = performance.now();
  $('mapBtn').disabled = true;
  (function tick(now){
    const p = Math.min(1, (now - t0)/dur);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    const which = Math.min(segs.length-1, Math.floor(e * segs.length));
    const local = e * segs.length - which;
    const pt = qpt(segs[which], local);
    if(marker) marker.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    if(p < 1) requestAnimationFrame(tick);
    else $('mapBtn').disabled = false;
  })(t0);
}

function showMap(animateFrom){
  drawMap();
  updateTop();
  const st = STAGES[stageIdx];
  $('legInfo').innerHTML = '<b>' + NODES[stageIdx].name + '</b>다음 구간 ' + st.days + '일';
  $('mapText').innerHTML = st.intro + (st.ready ? '' : ' <b style="color:var(--injoo)">· 준비 중</b>');
  $('mapBtn').textContent = st.ready ? (st.transport + '로 출발') : (st.transport + '로 그대로 지나기');
  swap('vMap');
  if(animateFrom !== undefined){
    const segs = legSegs(animateFrom);
    if(marker) marker.setAttribute('transform', `translate(${segs[0].a.x},${segs[0].a.y})`);
    travel(animateFrom);
  }
}

/* ── 구간(iframe) ────────────────────────────────── */
function startStage(){
  const st = STAGES[stageIdx];
  $('qPlace').textContent = st.place;
  $('qKind').textContent = st.kind;
  swap('vQuiz');

  /* 화로 구간(furnace)이고 지금까지 놓친 낱말이 하나도 없으면 전속
     항해(보너스)로 띄운다 - 사용자 결정, HANDOFF.md 4절. */
  const bonus = st.file === 'furnace.html' && missedIds.length === 0;
  const params = new URLSearchParams({ level: LEVEL, student_id: STUDENT_ID });
  if(bonus) params.set('mode', 'bonus');
  $('stageFrame').src = st.file + '?' + params.toString();
}

/* 아직 콘텐츠가 없는 구간(pacific/train) - 기본 소요일만 차감하고
   오답 0건으로 자동 통과시킨다. 나중에 문항이 들어오면 STAGES의
   ready를 true로, file은 그대로 두면 startStage()가 그대로 쓴다. */
function autoPass(){
  advanceStage({ wrong: 0, missedIds: [] });
}

/* 구간 하나가 끝났을 때(iframe postMessage 또는 autoPass) 공통으로
   타는 다음 구간 전환 로직. correct/wrong을 80일 예산에 반영하고
   (오답 1개당 1일, HANDOFF.md 4절), missedIds를 누적해 화로 구간
   보너스 여부 판단에 쓴다. */
function advanceStage(result){
  const st = STAGES[stageIdx];
  const wrong = result.wrong || 0;
  used += st.days + wrong;
  wrongCount += wrong;
  missedIds = missedIds.concat(result.missedIds || []);
  updateTop();
  const finished = stageIdx;
  stageIdx++;
  if(stageIdx >= STAGES.length) return ending();
  showMap(finished);
}

/* 구간 → 부모: postMessage로 결과를 올린다(HANDOFF.md 4절 형식 그대로).
   각 구간 파일이 이미 자기 attempt를 /vocab/attempt로 보내고 있으므로
   여기서는 절대 중복으로 보내지 않는다 - 집계값(correct/wrong/missedIds)만
   받아서 여정 진행에 반영한다(사용자 결정). */
window.addEventListener('message', (e) => {
  const data = e.data;
  if(!data || data.type !== 'stage_done') return;
  const st = STAGES[stageIdx];
  if(!st || !st.file || data.stage !== st.file.replace('.html','')) return;
  advanceStage(data);
});

/* ── 결말 ────────────────────────────────── */
function tallyHtml(){
  return '걸린 시간 ' + fmt(elapsed) + '<br>' +
    '틀린 문항 ' + wrongCount + '개 · 지체 ' + wrongCount + '일<br>' +
    (missedIds.length ? '다시 볼 낱말 ' + missedIds.length + '개' : '한 문항도 놓치지 않았습니다');
}

function ending(){
  stopClock();
  swap('vEnd');
  const arrived = used;

  if(round === 1){
    /* 첫 회차만 날짜변경선 반전을 보여준다(사용자 결정) */
    $('endBig').textContent = '제 ' + arrived + '일, 런던';
    $('endSub').innerHTML = arrived > 80
      ? '리폼 클럽의 시계는 이미 약속한 때를 지났습니다.<br>포그는 <b>내기에 졌다</b>고 믿었습니다.'
      : '포그는 시계를 보고 <b>하루가 모자란다</b>고 여겼습니다.';
    $('endTally').textContent = '';
    $('endBtn').textContent = '이튿날 아침';
    $('endBtn').onclick = () => {
      const real = arrived - 1;
      const win = real <= 80;
      $('endBig').textContent = '제 ' + real + '일';
      $('endSub').innerHTML = win
        ? '파스파르투가 뛰어듭니다. 해를 따라 <b>동쪽으로</b> 돌았으니 하루를 벌었습니다.<br>포그는 약속한 자리에 늦지 않았습니다.'
        : '날짜변경선으로 하루를 되찾았지만 그래도 늦었습니다.<br>다음에는 <b>지체를 줄여야</b> 합니다.';
      $('endTally').innerHTML = tallyHtml();
      $('endBtn').textContent = '다시 떠나기';
      $('endBtn').onclick = () => { round++; reset(); };
    };
  } else {
    /* 2회차부터는 날짜변경선 트릭 없이 80일 안에 들어와야 승리(사용자 결정) */
    const win = arrived <= 80;
    $('endBig').textContent = '제 ' + arrived + '일';
    $('endSub').innerHTML = win
      ? '이번에도 약속한 여든 날 안에 런던으로 돌아왔습니다.'
      : '여든 날을 넘겼습니다.<br>다음에는 <b>지체를 줄여야</b> 합니다.';
    $('endTally').innerHTML = tallyHtml();
    $('endBtn').textContent = '다시 떠나기';
    $('endBtn').onclick = () => { round++; reset(); };
  }
}

function reset(){
  stopClock(); elapsed = 0; paintClock();
  used = 0; stageIdx = 0; wrongCount = 0; missedIds = [];
  updateTop(); showMap();
}

function swap(id){ ['vMap','vQuiz','vEnd'].forEach(v => $(v).classList.toggle('hidden', v !== id)); }
$('mapBtn').onclick = () => {
  if(!clockT && stageIdx === 0) startClock();
  const st = STAGES[stageIdx];
  if(st.ready) startStage(); else autoPass();
};

updateTop();
showMap();
</script>
</body>
</html>
